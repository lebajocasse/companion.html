<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catalyst Training Companion — Vincent Husset</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

<!-- PWA: installability meta (Android + desktop via dynamic manifest below) -->
<meta name="theme-color" content="#14161A">

<!-- PWA: iPhone-specific home-screen behavior (Safari ignores manifest.json for this) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Catalyst">

<script>
(function(){
  // Single square icon (no separate image file needed) — dark panel bg, orange "C" mark
  const iconSVG = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">'
    + '<rect width="100" height="100" fill="#14161A"/>'
    + '<text x="50" y="70" font-family="Arial, sans-serif" font-weight="900" font-size="62" '
    + 'fill="#FF5A2E" text-anchor="middle">C</text></svg>';
  const iconDataUri = 'data:image/svg+xml;base64,' + btoa(iconSVG);

  // Apple touch icon (iPhone home-screen icon)
  const appleIcon = document.createElement('link');
  appleIcon.rel = 'apple-touch-icon';
  appleIcon.href = iconDataUri;
  document.head.appendChild(appleIcon);

  // Web app manifest (Android/Chrome install prompt) — built at runtime as a
  // Blob so no separate manifest.json file is needed.
  const manifest = {
    name: "Catalyst Training Companion",
    short_name: "Catalyst",
    start_url: "Catalyst.html",
    display: "standalone",
    background_color: "#14161A",
    theme_color: "#14161A",
    icons: [
      { src: iconDataUri, sizes: "192x192", type: "image/svg+xml" },
      { src: iconDataUri, sizes: "512x512", type: "image/svg+xml" }
    ]
  };
  const blob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
  const manifestLink = document.createElement('link');
  manifestLink.rel = 'manifest';
  manifestLink.href = URL.createObjectURL(blob);
  document.head.appendChild(manifestLink);
})();
</script>

<style>
  :root{
    --bg: #000000;
    --panel: #1D2025;
    --panel-alt: #262A30;
    --border: #33383F;
    --text: #ECE8DE;
    --text-dim: #9A9FA6;
    --accent: #FF5A2E;      /* hold orange */
    --accent-dim: #7A2F1B;
    --blue: #49AEDB;        /* video / info */
    --green: #7FD858;       /* complete */
    --gold: #C9A94F;        /* deload */
    --coached: #B565F5;     /* coached wall sessions */
    --pixel-clip-lg: polygon(0 16px,4px 16px,4px 12px,8px 12px,8px 8px,12px 8px,12px 4px,16px 4px,16px 0,
      calc(100% - 16px) 0,calc(100% - 16px) 4px,calc(100% - 12px) 4px,calc(100% - 12px) 8px,
      calc(100% - 8px) 8px,calc(100% - 8px) 12px,calc(100% - 4px) 12px,calc(100% - 4px) 16px,100% 16px,
      100% calc(100% - 16px),calc(100% - 4px) calc(100% - 16px),calc(100% - 4px) calc(100% - 12px),
      calc(100% - 8px) calc(100% - 12px),calc(100% - 8px) calc(100% - 8px),calc(100% - 12px) calc(100% - 8px),
      calc(100% - 12px) calc(100% - 4px),calc(100% - 16px) calc(100% - 4px),calc(100% - 16px) 100%,
      16px 100%,16px calc(100% - 4px),12px calc(100% - 4px),12px calc(100% - 8px),8px calc(100% - 8px),
      8px calc(100% - 12px),4px calc(100% - 12px),4px calc(100% - 16px),0 calc(100% - 16px));
    --pixel-clip-sm: polygon(0 8px,2px 8px,2px 6px,4px 6px,4px 4px,6px 4px,6px 2px,8px 2px,8px 0,
      calc(100% - 8px) 0,calc(100% - 8px) 2px,calc(100% - 6px) 2px,calc(100% - 6px) 4px,
      calc(100% - 4px) 4px,calc(100% - 4px) 6px,calc(100% - 2px) 6px,calc(100% - 2px) 8px,100% 8px,
      100% calc(100% - 8px),calc(100% - 2px) calc(100% - 8px),calc(100% - 2px) calc(100% - 6px),
      calc(100% - 4px) calc(100% - 6px),calc(100% - 4px) calc(100% - 4px),calc(100% - 6px) calc(100% - 4px),
      calc(100% - 6px) calc(100% - 2px),calc(100% - 8px) calc(100% - 2px),calc(100% - 8px) 100%,
      8px 100%,8px calc(100% - 2px),6px calc(100% - 2px),6px calc(100% - 4px),4px calc(100% - 4px),
      4px calc(100% - 6px),2px calc(100% - 6px),2px calc(100% - 8px),0 calc(100% - 8px));
    --radius: 10px;
    --display: 'VT323', 'Arial Narrow', monospace;
    --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;}
  body{padding:0 0 100px 0;}
  body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:1000;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,0.35) 0px,rgba(0,0,0,0.35) 1px,
      transparent 1px,transparent 3px);
    opacity:0.35;}
  .wrap{max-width:920px;margin:0 auto;padding:0 18px;}

  /* header */
  header{background:#000000;}
  .headbar{max-width:920px;margin:0 auto;padding:26px 18px 22px;
    display:flex;align-items:center;justify-content:center;}
  .led-title-wrap{width:100%;}
  .led-title{display:flex;justify-content:center;gap:7px;width:100%;}
  .led-letter{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr);
    gap:2px;flex:1;aspect-ratio:3/4;}
  .led-pixel{border-radius:2px;background:transparent;}
  .led-pixel.on{background:var(--accent);}
  .subtitle{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:0.1em;
    color:#FFFFFF;text-transform:uppercase;}
  .subtitle-box{background:var(--panel-alt);border:1px solid var(--border);clip-path:var(--pixel-clip-lg);
    padding:9px 16px;display:inline-block;margin-top:8px;}
  .meta{text-align:right;font-size:12.5px;color:var(--text-dim);line-height:1.7;}
  .meta b{color:var(--text);font-weight:600;}

  /* week tabs */
  .tabs{display:flex;gap:8px;margin:22px 0 6px;flex-wrap:wrap;}

  /* view switcher (Overview / Sesh) */
  .view-tabs{position:fixed;left:18px;right:18px;bottom:16px;max-width:884px;margin:0 auto;
    display:flex;gap:6px;background:rgba(29,32,37,0.82);backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);border:1px solid var(--border);
    border-radius:18px;padding:4px;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,0.4);}
  .view-tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:4px;font-family:var(--display);font-weight:800;font-size:13px;
    text-transform:uppercase;letter-spacing:0.03em;padding:10px 0 9px;border-radius:14px;cursor:pointer;
    color:rgba(255,255,255,0.8);}
  .view-tab-icon{width:23px;height:23px;}
  .view-tab-icon svg{width:100%;height:100%;}
  .view-tab.active{background:#fff;color:#14161A;}

  /* progress rings */
  .ring-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px;margin:8px 0;}
  .ring-grid > .ring-card:nth-child(5){grid-column:1 / -1;justify-self:center;max-width:50%;}
  .ring-card{display:flex;flex-direction:column;align-items:center;padding:8px 4px;}
  .ring-wrap{position:relative;width:100%;max-width:178px;aspect-ratio:1;margin:0 auto;}
  .ring-svg{width:100%;height:100%;}
  .ring-tick.lit{opacity:1;}
  .ring-tick.dim{opacity:1;animation:tickFlicker 2.4s steps(1) infinite;}
  @keyframes tickFlicker{0%,100%{stroke:#000000;}50%{stroke:#3A3D42;}}
  .ring-value{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-weight:800;font-size:25px;z-index:2;}
  .ring-inner-frame{position:absolute;top:19%;left:19%;width:62%;height:62%;
    border:2px solid var(--panel-alt);border-radius:50%;}
  .ring-label{margin-top:10px;font-family:var(--display);font-weight:700;font-size:15px;
    text-transform:uppercase;letter-spacing:0.04em;color:#FFFFFF;text-align:center;}
  .lvl-block{text-align:center;margin:20px 0 14px;}
  .vincent-label{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:0.08em;
    color:#FFFFFF;text-transform:uppercase;margin-bottom:8px;}
  .lvl-bar-track{position:relative;height:58px;background:var(--panel-alt);
    clip-path:var(--pixel-clip-lg);margin:16px 0 12px;padding:2px;}
  .lvl-bar-track-inner{position:relative;width:100%;height:100%;background:#000000;
    clip-path:var(--pixel-clip-lg);overflow:hidden;}
  .lvl-bar-leds{position:absolute;inset:0;display:flex;gap:2px;padding:0 2px;z-index:1;}
  .lvl-bar-led{flex:1;height:100%;}
  .lvl-bar-led.lit{animation:ledBarFlicker 3s steps(1) infinite;}
  @keyframes ledBarFlicker{
    0%{background:var(--accent);} 20%{background:var(--blue);} 40%{background:var(--green);}
    60%{background:var(--gold);} 80%{background:var(--coached);} 100%{background:var(--accent);}
  }
  .lvl-bar-led.dim{animation:ledBarFlickerDim 3s steps(1) infinite;}
  @keyframes ledBarFlickerDim{
    0%{background:#202024;} 25%{background:#2a2a2f;} 50%{background:#191a1d;}
    75%{background:#26262b;} 100%{background:#202024;}
  }
  .lvl-bar-label{position:absolute;inset:0;z-index:4;display:flex;align-items:center;justify-content:center;
    font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:0.04em;color:#FFFFFF;
    text-shadow:0 1px 2px rgba(0,0,0,0.9), 0 0 8px rgba(0,0,0,0.6);}

  /* shared boxed-section style (All-Time + This Cycle calendar) */
  .stat-box{background:var(--panel-alt);clip-path:var(--pixel-clip-lg);padding:2px;margin:16px 0;}
  .stat-box-inner{background:#000000;clip-path:var(--pixel-clip-lg);padding:12px;}
  .stat-box-title{font-family:var(--display);font-weight:800;font-size:15px;text-transform:uppercase;
    letter-spacing:0.1em;color:#FFFFFF;margin-bottom:12px;text-align:center;}

  .alltime-row{display:grid;gap:4px;}
  .alltime-row-5{grid-template-columns:repeat(5,1fr);}
  .alltime-stat{text-align:center;}
  .alltime-num{display:block;font-family:var(--mono);font-weight:800;font-size:19px;}
  .alltime-lbl{display:block;font-family:var(--display);font-weight:700;font-size:12px;
    text-transform:uppercase;letter-spacing:0.01em;color:#FFFFFF;margin-top:4px;}
  .alltime-hours{display:block;font-family:var(--mono);font-weight:800;font-size:15px;
    opacity:0.9;margin-top:1px;}

  /* calendar */
  .cal-row{display:grid;grid-template-columns:20px repeat(7,1fr);gap:4px;align-items:center;
    margin-bottom:4px;}
  .cal-daylabel{font-family:var(--mono);font-size:10px;color:var(--text-dim);text-align:center;}
  .cal-weeknum{font-family:var(--mono);font-size:11px;color:var(--text-dim);text-align:center;}
  .cal-box{aspect-ratio:1;clip-path:var(--pixel-clip-sm);background:var(--panel-alt);border:1px solid var(--border);}
  .cal-box.green{background:var(--green);border-color:var(--green);}
  .cal-box.rest{background:var(--panel-alt);border-color:var(--border);}
  .mini-pixel-letter{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr);
    gap:1px;width:55%;height:70%;margin:15% auto 0;}
  .mini-pixel{background:transparent;}
  .mini-pixel.on{background:var(--text-dim);border-radius:0.5px;}
  .cal-box.coached{background:var(--coached);border-color:var(--coached);}
  .cal-box.muted{background:var(--panel-alt);opacity:0.35;}

  /* celebration overlay */
  #celebrationOverlay{position:fixed;top:28%;left:50%;width:90%;max-width:360px;
    transform:translateX(-50%) translateY(14px) scale(0.75) rotate(-2deg);
    font-family:var(--display);font-weight:900;font-size:50px;
    line-height:1.1;text-transform:uppercase;letter-spacing:0.01em;
    background:linear-gradient(90deg,#FF5A2E,#FFD23F,#7FD858,#49AEDB,#B565F5,#FF5A2E);
    background-size:300% 100%;-webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:transparent;
    filter:drop-shadow(0 6px 18px rgba(0,0,0,0.8));
    z-index:200;opacity:0;pointer-events:none;text-align:center;
    transition:opacity .3s ease, transform .5s cubic-bezier(.34,1.56,.64,1);}
  #celebrationOverlay.show{opacity:1;transform:translateX(-50%) translateY(0) scale(1) rotate(0deg);
    animation:rainbowShift 1.8s linear infinite;}
  @keyframes rainbowShift{
    0%{background-position:0% 50%;}
    100%{background-position:100% 50%;}
  }
  .confetti-container{position:fixed;inset:0;pointer-events:none;z-index:199;overflow:hidden;}
  .confetti-piece{position:absolute;top:-24px;width:9px;height:15px;opacity:0.95;border-radius:2px;
    animation-name:confettiFall;animation-timing-function:cubic-bezier(.3,0,.7,1);animation-fill-mode:forwards;}
  @keyframes confettiFall{
    0%{transform:translateY(0) rotate(0deg);opacity:1;}
    100%{transform:translateY(112vh) rotate(var(--rot));opacity:0.25;}
  }

  /* full green fill once ticked */
  .drill.ticked{border:2px solid var(--green);border-radius:8px;margin:0 -8px 0 -8px;padding-left:8px;
    padding-right:8px;}
  tr.ticked td{box-shadow:inset 0 2px 0 var(--green), inset 0 -2px 0 var(--green);}
  tr.ticked td:first-child{box-shadow:inset 0 2px 0 var(--green), inset 0 -2px 0 var(--green), inset 2px 0 0 var(--green);}
  tr.ticked td:last-child{box-shadow:inset 0 2px 0 var(--green), inset 0 -2px 0 var(--green), inset -2px 0 0 var(--green);}

  .tab{font-family:var(--mono);font-weight:700;font-size:13px;padding:9px 14px;border-radius:7px;
    background:var(--panel);border:1px solid var(--border);color:var(--text-dim);cursor:pointer;
    letter-spacing:0.03em;transition:all .12s ease;}
  .tab:hover{border-color:#4a5058;color:var(--text);}
  .tab.active{background:#fff;border-color:#fff;color:#14161A;}
  .tab.week-done{box-shadow:0 0 0 2px var(--green) inset;}
  .tab.deload.active{background:var(--gold);border-color:var(--gold);}

  /* coach note */
  .coachnote{background:var(--panel);border:1px solid var(--border);border-left:4px solid var(--accent);
    border-radius:var(--radius);padding:16px 18px;margin:16px 0 26px;font-size:14.5px;line-height:1.6;}
  .coachnote .tag{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:0.1em;
    font-size:15px;color:var(--accent);margin-bottom:6px;display:block;}
  .coachnote-card{border-left:4px solid #FFFFFF;margin-bottom:22px;}
  .coachnote-card .card-body{white-space:pre-line;font-size:14px;line-height:1.6;}

  /* day structure */
  .day-header{font-family:var(--display);font-weight:800;font-size:16px;text-transform:uppercase;
    letter-spacing:0.14em;color:var(--text-dim);margin:26px 0 10px;padding-bottom:7px;
    border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;}
  .day-header:first-of-type{margin-top:4px;}
  .day-header .day-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex-shrink:0;}
  .rest-day{background:var(--panel);border:1px dashed var(--border);border-radius:var(--radius);
    padding:16px;margin-bottom:8px;color:var(--text-dim);font-size:13px;text-align:center;
    font-style:italic;}
  .readonly-banner{background:var(--panel-alt);border:1px solid var(--border);border-radius:8px;
    padding:10px 14px;margin:14px 0 4px;font-size:12.5px;color:var(--text-dim);text-align:center;}

  /* login gate */
  #loginScreen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;
    justify-content:center;padding:20px;z-index:100;}
  .login-card{background:var(--panel-alt);clip-path:var(--pixel-clip-lg);padding:2px;
    max-width:340px;width:100%;}
  .login-card-inner{background:#000000;clip-path:var(--pixel-clip-lg);padding:28px 26px;}
  .login-card .led-title-wrap{margin-bottom:22px;}
  .login-card .led-title{gap:5px;}
  .login-card .led-letter{max-width:28px;}
  .login-card .subtitle{margin-bottom:20px;}
  .login-card input{width:100%;background:var(--panel-alt);border:1px solid var(--border);
    clip-path:var(--pixel-clip-sm);color:var(--text);padding:10px 12px;font-size:16px;margin-bottom:10px;
    font-family:inherit;box-sizing:border-box;}
  .login-card button{width:100%;background:var(--accent);color:#1a0d06;border:none;clip-path:var(--pixel-clip-sm);
    padding:11px;font-weight:800;font-size:17px;cursor:pointer;font-family:var(--display);
    letter-spacing:0.03em;text-transform:uppercase;margin-top:4px;}
  .login-error{color:#FF8A6B;font-size:12.5px;margin-top:10px;min-height:16px;}
  .demo-banner{background:#1E2A24;border:1px solid #2E4A3B;clip-path:var(--pixel-clip-lg);padding:10px 14px;
    margin:16px 0 4px;font-size:12.5px;color:#8FD9AE;text-align:center;}
  .logout-link{font-family:var(--mono);font-size:11px;color:var(--text-dim);cursor:pointer;
    text-decoration:underline;display:inline-block;}
  #pageFooter{text-align:center;padding:24px 18px 40px;}

  /* section card */
  .card{background:var(--panel-alt);clip-path:var(--pixel-clip-lg);padding:2px;
    margin-bottom:14px;transition:background-color .15s ease;}
  .card-inner{background:#000000;clip-path:var(--pixel-clip-lg);overflow:hidden;}
  .card.session-done{background:var(--green);}
  .card.session-done .card-head{background:rgba(127,216,88,0.5);}
  .card.coaching-done{background:var(--coached);}
  .card.coaching-done .card-head{background:rgba(181,101,245,0.5);}
  .coach-day-toggle{display:flex;gap:8px;}
  .coach-day-btn{flex:1;font-family:var(--display);font-weight:800;font-size:16px;
    text-transform:uppercase;letter-spacing:0.04em;padding:9px 0;clip-path:var(--pixel-clip-sm);
    background:var(--panel-alt);border:1px solid var(--border);color:var(--text-dim);cursor:pointer;}
  .coach-day-btn.selected{background:var(--coached);border-color:var(--coached);color:#1a0d2e;}
  .session-check{width:18px;height:18px;accent-color:var(--green);flex-shrink:0;cursor:pointer;margin:0;}
  .card-head{display:flex;flex-direction:column;gap:10px;padding:15px 16px;cursor:pointer;
    user-select:none;}
  .card-head-row{display:flex;align-items:center;gap:12px;}
  .card-head:hover{background:var(--panel-alt);}
  .code-tag{font-family:var(--mono);font-weight:700;font-size:11.5px;padding:4px 8px;border-radius:5px;
    background:var(--accent-dim);color:#FFB199;letter-spacing:0.03em;white-space:nowrap;}
  .card-title{font-family:var(--display);font-weight:800;font-size:22px;text-transform:uppercase;
    letter-spacing:0.02em;flex:1;}
  .card-time{font-family:var(--mono);font-size:12.5px;color:var(--text-dim);white-space:nowrap;}
  .chevron{font-size:12px;color:var(--text-dim);transition:transform .15s ease;}
  .card.open .chevron{transform:rotate(90deg);}
  .card-body{display:none;padding:2px 16px 18px;border-top:1px solid var(--border);}
  .card.open .card-body{display:block;}
  .progress-pill{font-family:var(--mono);font-size:11px;color:var(--text-dim);}
  .progress-pill.done{color:var(--green);}

  /* drill */
  .drill{padding:14px 0;border-bottom:1px solid var(--border);}
  .drill:last-child{border-bottom:none;}
  .drill-row{display:flex;align-items:flex-start;gap:10px;}
  .drill input[type=checkbox]{margin-top:3px;width:17px;height:17px;accent-color:var(--green);flex-shrink:0;cursor:pointer;}
  .drill-name{font-weight:700;font-size:14.5px;}
  .drill-time{font-family:var(--mono);font-size:11.5px;color:var(--text-dim);margin-left:8px;}
  .drill-desc{font-size:13.5px;color:var(--text-dim);margin-top:5px;line-height:1.55;}
  .drill-actions{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .vid-btn{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;
    color:var(--blue);text-decoration:none;border:1px solid #2C4A57;background:#182428;
    padding:6px 10px;border-radius:6px;}
  .vid-btn:hover{background:#1c2e34;}
  .vid-btn{cursor:pointer;font-family:inherit;}
  .vid-embed{display:none;}
  .vid-embed.open{display:block;margin-top:10px;position:relative;width:100%;max-width:420px;
    aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:#000;border:1px solid var(--border);}
  .vid-embed.open iframe{width:100%;height:100%;border:0;display:block;}
  .vid-fallback{font-size:11.5px;color:var(--text-dim);margin-top:6px;}
  .vid-fallback a{color:var(--blue);}

  /* set tables (fingerboard / conditioning) */
  .set-table{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px;}
  .set-table th{text-align:left;font-family:var(--display);font-weight:700;font-size:14px;

<script>
/* ---------- LED DOT-MATRIX TITLE ---------- */
const LED_BITMAPS = {
  C: ['111','100','100','111'],
  A: ['010','101','111','101'],
  T: ['111','010','010','010'],
  L: ['100','100','100','111'],
  Y: ['101','101','010','010'],
  S: ['111','100','011','111'],
  U: ['101','101','101','111'],
  R: ['111','101','110','101'],
  O: ['111','101','101','111'],
  K: ['101','110','110','101'],
  '!': ['010','010','000','010'],
  ' ': ['000','000','000','000']
};
const LED_COLORS = ['#FF5A2E','#49AEDB','#7FD858','#C9A94F','#B565F5'];

function buildLEDLetter(letter){
  const bmp = LED_BITMAPS[letter];
  if(!bmp) return '';
  let cells = '';
  for(const row of bmp){
    for(const bit of row){
      cells += bit === '1'
        ? `<div class="led-pixel on" style="background:${LED_COLORS[Math.floor(Math.random()*LED_COLORS.length)]}"></div>`
        : `<div class="led-pixel"></div>`;
    }
  }
  return `<span class="led-letter">${cells}</span>`;
}
function buildLvlBarLeds(count, litCount){
  let bars = '';
  for(let i=0; i<count; i++){
    const lit = i < litCount;
    bars += `<div class="lvl-bar-led ${lit?'lit':'dim'}" style="animation-delay:-${(Math.random()*3).toFixed(2)}s"></div>`;
  }
  return bars;
}
function miniPixelLetter(letter){
  const bmp = LED_BITMAPS[letter];
  if(!bmp) return '';
  let cells = '';
  for(const row of bmp){
    for(const bit of row){
      cells += bit === '1' ? '<div class="mini-pixel on"></div>' : '<div class="mini-pixel"></div>';
    }
  }
  return `<div class="mini-pixel-letter">${cells}</div>`;
}
function renderLEDTitles(){
  document.querySelectorAll('.led-title[data-word]').forEach(el=>{
    el.innerHTML = el.dataset.word.split('').map(buildLEDLetter).join('');
  });
}
function startLEDFlicker(){
  document.querySelectorAll('.led-pixel.on').forEach(px=>{
    (function loop(){
      const delay = 350 + Math.random()*1200;
      setTimeout(()=>{
        px.style.background = LED_COLORS[Math.floor(Math.random()*LED_COLORS.length)];
        loop();
      }, delay);
    })();
  });
}
renderLEDTitles();
startLEDFlicker();

/* ---------- VIDEO LINKS ---------- */
const VID = {
  A1: "https://youtu.be/VkWt3qsmXJ4",
  A2: "https://youtu.be/QT1CJtIk-Ls",

  B8: "https://youtu.be/fv71ejrYBXE",

  C:  "https://youtu.be/GKN9_e4XEaM",

/* ---------- COACH NOTES PER WEEK ---------- */
const COACH_NOTES = {
  1: `I have given you a straightforward strength based plan. There is lots of scope to work on technique and mindset, etc, but we can address those in future plans.
Your first session is projecting — choose limit boulders, ones you would normally be wary of trying, and set appropriate goals for each session. The second session is on-the-wall strength training: a bit of overhang fitness, then some boulder-specific strength work.

Try Hard, Have Fun and Fall Off More!`,

Keep pushing the conditioning as hard as you can while still finishing every rep with good form.`,

};

/* ---------- SHARED SESSION TEMPLATES (Weeks 1-4 identical) ---------- */
function onWallSession1(){

    title: "On The Wall — Session 1 (Projecting)",
    code: "C",
    time: "~120 min",
    drills: [
      {code:"A1", name:"Dynamic Stretching Warm Up", time:"10 min", vid:VID.A1,
        desc:"Work up through every joint from toes to head — 5 slow circles/clenches, then 5 fast ones, at each joint."},
      {code:"A2", name:"Cardio Warm Up", time:"10 min", vid:VID.A2,
        desc:"Raise your temperature with floor-based movement (Lizard / Frog / Bird / Chimpanzee) or any cardio you enjoy."},
      {code:"A3", name:"Easy Climbing Warm Up", time:"10 min", vid:VID.A3,
        desc:"Progress up through the grades on easy climbs to get warm before the session's main work."},
      {code:"B8", name:"One Touch Only", time:"20 min", vid:VID.B8,
        desc:"Get fully warmed up by progressing through the grades while focusing intently on precision of hand/foot placement. Move slowly and with control — once a hand/foot is placed, it doesn't move again."},
      {code:"C", name:"Projecting — Hard Project Time!", time:"70 min", vid:VID.C, special:"projecting",
        desc:"Walk the gym and pick 1–2 boulders that genuinely psych you — check the setting schedule so they'll be up for ~3 weeks. The goal is NOT to send yet."}
    ]
  };
}
function onWallSessionClass(){

    title: "On The Wall — Session 2 (Class)",
    code: "",

}

    title: "On The Wall — Session 3 (Strength)",
    code: "E",
    time: "~120 min",
    drills: [
      {code:"A1", name:"Dynamic Stretching Warm Up", time:"10 min", vid:VID.A1,
        desc:"Same warm-up routine as Session 1 — toes to head, slow then fast."},
      {code:"A2", name:"Cardio Warm Up", time:"10 min", vid:VID.A2,

        extraVid:{label:"Robot rules", href:VID.ROBOT_RULES}},
      {code:"E1", name:"Core Strength Training", time:"15 min", vid:VID.E1,
        desc:"Choose a steep, juggy climb and remove both feet from the wall after each hand move before placing them back. Start at the hardest level (no momentum, no bending legs) and drop down levels only as needed to finish."}
    ]
  };
}
function conditioning(){
  return {
    title: "Conditioning — TRX",
    code: "J",
    time: "30 min",
    rounds: 4,
    exercises: [
      {code:"J16", name:"I's (TRX)", reps:10, vid:VID.J16},
      {code:"J17", name:"Y's (TRX)", reps:10, vid:VID.J17},
      {code:"J18", name:"T's (TRX)", reps:10, vid:VID.J18},
      {code:"J12", name:"Suspension Push-ups — Wide", reps:10, vid:VID.J12}
    ],
    rest:"Rest 5 min between rounds",
    note:"Go as hard as you can — sink deep into each position and still complete every rep, resting as little as possible between reps while still able to finish the set."
  };
}
function fingerboardMaxHangs(){
  return {
    title: "Fingerboard — Session 1 (Max Hangs)",
    time: "~25 min",
    guideVid: VID.FB_GUIDE,
    sets: [
      {n:1, grip:"4 finger Chisel grip, 20mm", hang:"10 sec", rest:"3 min"},
      {n:2, grip:"4 finger Chisel grip, 20mm", hang:"10 sec", rest:"3 min"},
      {n:3, grip:"4 finger Chisel grip, 20mm", hang:"10 sec", rest:"3 min"},
      {n:7, grip:"Front 3 finger open hand, 20mm", hang:"10 sec", rest:"3 min"},
      {n:8, grip:"Front 3 finger open hand, 20mm", hang:"10 sec", rest:"3 min"},
      {n:9, grip:"Front 3 finger open hand, 20mm", hang:"10 sec", rest:"3 min"},
      {n:13, grip:"30° slopers, 20mm", hang:"10 sec", rest:"3 min"},
      {n:14, grip:"30° slopers, 20mm", hang:"10 sec", rest:"3 min"},
      {n:15, grip:"30° slopers, 20mm", hang:"10 sec", rest:"3 min", last:true}
    ],
    note:"Aim for ~80% intensity on every hang. Calibrate added weight/assistance in your first session to find that RPE."
  };
}
function fingerboardRepeaters(){
  return {
    title: "Fingerboard — Session 2 (Repeaters)",
    time: "~20 min",
    guideVid: VID.FB_GUIDE,
    sets: [
      {n:1, grip:"4 finger Half crimp, 20mm", hang:"7 sec on / 3 sec off × 10", rest:"4 min"},
      {n:2, grip:"4 finger Half crimp, 20mm", hang:"7 sec on / 3 sec off × 10", rest:"4 min"},
      {n:3, grip:"Front 3 finger Half crimp, 20mm", hang:"7 sec on / 3 sec off × 10", rest:"4 min"},
      {n:4, grip:"Front 3 finger Half crimp, 20mm", hang:"7 sec on / 3 sec off × 10", rest:"4 min"},

const STRETCH_LIST = [
  {name:"Shoulders 1", time:"1 min / side"},
  {name:"Shoulders 2", time:"1 min / side"},
  {name:"Chest", time:"1 min / side"},
  {name:"Forearms 1", time:"2 min"},
  {name:"Forearms 2", time:"2 min"},
  {name:"Biceps", time:"2 min"},
  {name:"Hamstring 1", time:"1 min / side"},
  {name:"Hamstring 2", time:"1 min / side"},
  {name:"Lizard", time:"1 min / side"},
  {name:"Pigeon", time:"1 min / side"},
  {name:"Frog", time:"2 min"},
  {name:"Box Splits", time:"2 min"}
];
function stretchSession(n){

/* ---------- BUILD WEEKS ---------- */
const WEEKS = {};
[1,2,3,4].forEach(w=>{
  WEEKS[w] = {
    deload:false,
    coachNote: COACH_NOTES[w] || null,
    onWall1: onWallSession1(),
    onWallClass: onWallSessionClass(),

  };

WEEKS[5] = {deload:true, coachNote: COACH_NOTES[5]};

/* ---------- DAY PLAN (shared by calendar + celebration logic) ---------- */
const DAY_PLAN = [
  {label:'M', rest:false, cardKeys:['onwall1','stretch1']},
  {label:'T', rest:false, cardKeys:['fbmax']},
  {label:'W', rest:false, cardKeys:['onwallclass']},
  {label:'T', rest:true,  cardKeys:[]},
  {label:'F', rest:false, cardKeys:['fbrep']},
  {label:'S', rest:false, cardKeys:['onwall3','stretch2']},
  {label:'S', rest:false, cardKeys:['conditioning']}
];

const CELEBRATION_MESSAGES = [
  "LEVEL CLEARED!",
  "STAGE COMPLETE!",
  "NICE COMBO!",
  "HIGH SCORE!",
  "PERFECT RUN!",
  "1-UP!",
  "CHECKPOINT SAVED!",
  "FLAWLESS VICTORY!",
  "GG WELL PLAYED!"
];
const BOSS_MESSAGES = [
  "BOSS SESH DONE!",
  "GREAT COACHING SESH!",
  "COACH APPROVED!",
  "LEVELED UP WITH THE BOSS!"
];

/* ---------- PROGRESS COUNTING (Overview tab) ---------- */
const CYCLE_SESSION_KEYS = { wall: [], fingerboard: [], conditioning: [], stretching: [], coachedOnly: [] };
[1,2,3,4].forEach(w=>{
  const wk = `w${w}`;
  CYCLE_SESSION_KEYS.wall.push(`done:${wk}:onwall1:session`, `done:${wk}:onwallclass:session`, `done:${wk}:onwall3:session`);
  CYCLE_SESSION_KEYS.fingerboard.push(`done:${wk}:fbmax:session`, `done:${wk}:fbrep:session`);
  CYCLE_SESSION_KEYS.conditioning.push(`done:${wk}:conditioning:session`);
  CYCLE_SESSION_KEYS.stretching.push(`done:${wk}:stretch1:session`, `done:${wk}:stretch2:session`);
  CYCLE_SESSION_KEYS.coachedOnly.push(`done:${wk}:coaching:session`);
});
CYCLE_SESSION_KEYS.stretching.push('done:w5:stretch1:session', 'done:w5:stretch2:session', 'done:w5:stretch3:session');

const WEEK_SESSION_KEYS = {};
[1,2,3,4].forEach(w=>{
  const wk = `w${w}`;
  WEEK_SESSION_KEYS[wk] = ['onwall1','onwallclass','onwall3','fbmax','fbrep','conditioning','stretch1','stretch2']
    .map(s=>`done:${wk}:${s}:session`);
});
WEEK_SESSION_KEYS['w5'] = ['stretch1','stretch2','stretch3'].map(s=>`done:w5:${s}:session`);

const SESSION_DURATION_MIN = {
  onwall1:120, onwallclass:120, onwall3:120, coaching:120,
  fbmax:25, fbrep:20,
  conditioning:30,
  stretch1:20, stretch2:20, stretch3:20
};
function suffixFromSessionKey(key){
  return key.split(':')[2]; // "done:w1:onwall1:session" -> "onwall1"
}
async function countTrue(keys){
  let n = 0;
  for(const k of keys){ if(await getVal(k, false)) n++; }
  return n;
}
async function anyTrue(keys){
  for(const k of keys){ if(await getVal(k, false)) return true; }
  return false;
}
async function allTrue(keys){
  for(const k of keys){ if(!(await getVal(k, false))) return false; }
  return true;
}
async function categoryHours(keys){
  let min = 0;
  for(const k of keys){
    if(await getVal(k, false)) min += SESSION_DURATION_MIN[suffixFromSessionKey(k)] || 0;
  }
  return min/60;
}
async function computeCycleCounts(){
  const wall = await countTrue(CYCLE_SESSION_KEYS.wall);
  const fingerboard = await countTrue(CYCLE_SESSION_KEYS.fingerboard);
  const conditioning = await countTrue(CYCLE_SESSION_KEYS.conditioning);
  const stretching = await countTrue(CYCLE_SESSION_KEYS.stretching);
  const coached = await countTrue(CYCLE_SESSION_KEYS.coachedOnly);
  const wallHours = await categoryHours(CYCLE_SESSION_KEYS.wall);
  const fingerboardHours = await categoryHours(CYCLE_SESSION_KEYS.fingerboard);
  const conditioningHours = await categoryHours(CYCLE_SESSION_KEYS.conditioning);
  const stretchingHours = await categoryHours(CYCLE_SESSION_KEYS.stretching);
  const coachedHours = await categoryHours(CYCLE_SESSION_KEYS.coachedOnly);
  return { wall, fingerboard, conditioning, stretching, coached,
           wallHours, fingerboardHours, conditioningHours, stretchingHours, coachedHours,
           maxWall:12, maxFingerboard:8, maxConditioning:4, maxStretching:11 };
}
async function computeAllTime(cycleCounts){
  return {
    wall: (await getArchivedTotal('wall')) + cycleCounts.wall,
    fingerboard: (await getArchivedTotal('fingerboard')) + cycleCounts.fingerboard,
    conditioning: (await getArchivedTotal('conditioning')) + cycleCounts.conditioning,
    stretching: (await getArchivedTotal('stretching')) + cycleCounts.stretching,
    coached: (await getArchivedTotal('coached')) + cycleCounts.coached,
    wallHours: (await getArchivedTotal('wallHours')) + cycleCounts.wallHours,
    fingerboardHours: (await getArchivedTotal('fingerboardHours')) + cycleCounts.fingerboardHours,
    conditioningHours: (await getArchivedTotal('conditioningHours')) + cycleCounts.conditioningHours,
    stretchingHours: (await getArchivedTotal('stretchingHours')) + cycleCounts.stretchingHours,
    coachedHours: (await getArchivedTotal('coachedHours')) + cycleCounts.coachedHours
  };
}
async function computeCalendarGrid(){
  const grid = [];
  for(let w=1; w<=5; w++){
    const wk = `w${w}`;
    if(w === 5){
      grid.push(DAY_PLAN.map(() => ({state: 'rest'})));
      continue;
    }
    const bossDone = await getVal(`done:${wk}:coaching:session`, false);
    const bossDay = bossDone ? await getVal(`weekendday:${wk}:coaching`, null) : null;
    const row = [];
    for(let i=0; i<DAY_PLAN.length; i++){
      const d = DAY_PLAN[i];
      if(d.rest){ row.push({state:'rest'}); continue; }
      let any = false;
      for(const suffix of d.cardKeys){
        if(await getVal(`done:${wk}:${suffix}:session`, false)){ any = true; break; }
      }
      const isSat = i === 5, isSun = i === 6;
      if((isSat && bossDay === 'sat') || (isSun && bossDay === 'sun')){
        row.push({state:'coached'});
      } else {
        row.push({state: any ? 'green' : 'blank'});
      }
    }
    grid.push(row);
  }
  return grid;
}
function findDayForCardKey(cardKey){
  // cardKey like "w1:onwall1" -> find which DAY_PLAN entry contains that suffix
  const [wk, suffix] = cardKey.split(':');
  if(!wk || !suffix) return null;
  const entry = DAY_PLAN.find(d => d.cardKeys.includes(suffix));
  return entry ? {weekKey: wk, entry} : null;
}
async function isDayFullyDone(weekKey, entry){
  if(!entry.cardKeys.length) return false;
  for(const suffix of entry.cardKeys){
    if(!(await getVal(`done:${weekKey}:${suffix}:session`, false))) return false;
  }
  return true;
}

const STORAGE_PREFIX = 'catalyst_companion:';
// Every plan cycle gets its own permanent namespace, so uploading next
// month's plan can never overwrite or collide with this month's history.
window.CYCLE_ID = 'cycle-2026-08';
let storageBackend = 'memory'; // 'memory' until login resolves which mode applies
const memoryStore = {};

function cycleKey(key){ return `${window.CYCLE_ID}:${key}`; }

async function getVal(key, fallback){
  const fullKey = cycleKey(key);
  if(storageBackend === 'memory'){
    return Object.prototype.hasOwnProperty.call(memoryStore, fullKey) ? memoryStore[fullKey] : fallback;
  }
  try{
    const v = localStorage.getItem(STORAGE_PREFIX + fullKey);
    return v === null ? fallback : JSON.parse(v);
  }catch(e){ return fallback; }
}
async function setVal(key, val){
  const fullKey = cycleKey(key);
  if(storageBackend === 'memory'){
    memoryStore[fullKey] = val;
    return;
  }
  try{ localStorage.setItem(STORAGE_PREFIX + fullKey, JSON.stringify(val)); }
  catch(e){ console.error("storage set failed", e); }
}
// Permanent, cycle-independent totals from cycles that have already ended.
// Starts at 0 — will be incremented by hand each time a new monthly plan
// replaces this one, so All-Time keeps growing across every past cycle.
async function getArchivedTotal(category){
  return await getValRaw(`archived:${category}`, 0);

async function getValRaw(rawKey, fallback){
  if(storageBackend === 'memory'){
    return Object.prototype.hasOwnProperty.call(memoryStore, rawKey) ? memoryStore[rawKey] : fallback;
  }
  try{
    const v = localStorage.getItem(STORAGE_PREFIX + rawKey);
    return v === null ? fallback : JSON.parse(v);
  }catch(e){ return fallback; }
}
async function setValRaw(rawKey, val){
  if(storageBackend === 'memory'){
    memoryStore[rawKey] = val;
    return;
  }
  try{ localStorage.setItem(STORAGE_PREFIX + rawKey, JSON.stringify(val)); }

function animateNumber(el, target, suffix){
  suffix = suffix || '';
  const duration = 750;
  const start = performance.now();
  function step(now){
    const t = Math.min(1, (now-start)/duration);
    const eased = 1 - Math.pow(1-t, 3);
    el.textContent = Math.round(target*eased) + suffix;
    if(t < 1) requestAnimationFrame(step);
    else el.textContent = target + suffix;
  }
  requestAnimationFrame(step);
}

function ringSVG(value, max, colorVar, ringId){
  const pct = max > 0 ? Math.min(1, value/max) : 0;
  const N = 96;
  const litCount = Math.round(pct * N);
  const cx = 50, cy = 50, rOuter = 45, rInner = 36;
  let ticks = '';
  for(let i=0; i<N; i++){
    const angle = (i * 360/N - 90) * Math.PI/180;
    const x1 = (cx + rInner*Math.cos(angle)).toFixed(2);
    const y1 = (cy + rInner*Math.sin(angle)).toFixed(2);
    const x2 = (cx + rOuter*Math.cos(angle)).toFixed(2);
    const y2 = (cy + rOuter*Math.sin(angle)).toFixed(2);
    ticks += `<line class="ring-tick dim" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"
      stroke="#3A3D42" stroke-width="1.8" stroke-linecap="round" style="animation-delay:${(i*0.025).toFixed(2)}s"/>`;
  }
  return `<svg viewBox="0 0 100 100" class="ring-svg" data-lit-count="${litCount}" data-color="${colorVar}" data-n="${N}">${ticks}</svg>`;
}
function runRingChase(svg){
  const N = parseInt(svg.dataset.n, 10);
  const litCount = parseInt(svg.dataset.litCount, 10);
  const color = svg.dataset.color;
  const ticks = Array.from(svg.querySelectorAll('.ring-tick'));
  const chaseWidth = Math.max(8, Math.round(N/7));
  const totalSteps = 70;
  const laps = 7;
  let step = 0;
  // Remove dim/lit during the chase so the idle CSS flicker can't fight
  // these per-frame JS colors — classes get cleanly reapplied at settle.
  ticks.forEach(el => el.classList.remove('dim', 'lit'));
  function easeOut(t){ return 1 - Math.pow(1-t, 3); }
  function frame(){
    if(step >= totalSteps){
      ticks.forEach((el,i)=>{
        const on = i < litCount;
        el.classList.toggle('lit', on);
        el.classList.toggle('dim', !on);
        if(on){
          el.setAttribute('stroke', color);
          const frac = litCount > 0 ? i/litCount : 0;
          el.setAttribute('stroke-opacity', frac < 0.34 ? 0.4 : (frac < 0.67 ? 0.7 : 1));
        } else {
          el.setAttribute('stroke', '#3A3D42');
          el.removeAttribute('stroke-opacity');
        }
      });
      return;
    }
    const eased = easeOut(step/totalSteps);
    const pos = Math.floor(eased * laps * N) % N;
    ticks.forEach((el,i)=>{
      const on = ((i - pos + N) % N) < chaseWidth;
      el.setAttribute('stroke', on ? color : '#3A3D42');
    });
    step++;
    setTimeout(frame, 20);
  }
  frame();
}

    body = `<div class="note-box">This is your coached class session — no set drills listed here yet. Just tick the box above once it's done.</div>`;

    body = session.drills.map((d,i)=>{

      return drillHTML(sessionKey, d, i);

  return cardShell(sessionKey, session.title, session.code, session.time, body, needsDayGate);
}

function conditioningCardHTML(weekKey, c){

  for(let r=1; r<=c.rounds; r++){

      const ckKey = `${weekKey}:cond:r${r}:${ex.code}`;
      return `
      <div class="drill">

            <span class="drill-time">${ex.reps} reps</span>

    }).join('');

        ${r < c.rounds ? `<div class="note-box" style="margin:8px 0;">${c.rest}</div>` : ''}

  }
  const body = `<div class="note-box">${c.note}</div>${rounds}`;

}

async function updateBWDisplay(skey, weightValue){
  const span = document.querySelector(`.fb-bw-pct[data-bw-for="${skey}"]`);
  if(!span) return;
  const bw = parseFloat(await getValRaw('bodyWeight', ''));
  if(!bw || isNaN(bw) || bw <= 0){ span.textContent = ''; return; }
  const added = parseFloat(weightValue);
  const addedNum = isNaN(added) ? 0 : added;
  span.textContent = Math.round(((bw + addedNum) / bw) * 100) + '%';
}

/* ---------- INTERACTIVITY ---------- */
function attachHandlers(){
  document.querySelectorAll('.card-head').forEach(h=>{
    h.onclick = ()=>{
      const card = h.closest('.card');
      const key = card.dataset.card;
      const isOpen = openCards.has(key);
      if(isOpen){
        openCards.delete(key);
        card.classList.remove('open');
      } else {
        document.querySelectorAll('.card.open').forEach(c=>{
          if(c !== card){ openCards.delete(c.dataset.card); c.classList.remove('open'); }
        });
        openCards.add(key);
        card.classList.add('open');
      }
    };
  });

  document.querySelectorAll('.vid-btn[data-embed]').forEach(btn=>{
    btn.onclick = ()=>{
      const target = document.getElementById(btn.dataset.target);
      const wasOpen = target.classList.contains('open');

      // close every other open video first (accordion behaviour)
      document.querySelectorAll('.vid-btn[data-embed]').forEach(otherBtn=>{
        if(otherBtn === btn) return;
        const otherTarget = document.getElementById(otherBtn.dataset.target);
        if(otherTarget && otherTarget.classList.contains('open')){
          otherTarget.classList.remove('open');
          otherTarget.innerHTML = '';
          const otherFallback = otherTarget.nextElementSibling && otherTarget.nextElementSibling.classList.contains('vid-fallback')
            ? otherTarget.nextElementSibling : null;
          if(otherFallback) otherFallback.remove();
          otherBtn.textContent = otherBtn.dataset.label;
        }
      });

      const existingFallback = target.nextElementSibling && target.nextElementSibling.classList.contains('vid-fallback')
        ? target.nextElementSibling : null;
      if(wasOpen){
        target.classList.remove('open');
        target.innerHTML = '';
        if(existingFallback) existingFallback.remove();
        btn.textContent = btn.dataset.label;
      } else {
        target.classList.add('open');
        target.innerHTML = `<iframe src="${btn.dataset.embed}?autoplay=1&playsinline=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
        btn.textContent = btn.dataset.label.replace('▶', '▼').replace(/Watch/i, 'Hide');
        const fallback = document.createElement('div');
        fallback.className = 'vid-fallback';
        fallback.innerHTML = `Video blocked here? <a href="${btn.dataset.watch}" target="_blank" rel="noopener">Open on YouTube instead ↗</a>`;
        target.after(fallback);
      }
    };
  });

  document.querySelectorAll('input[type=checkbox][data-key]').forEach(cb=>{
    cb.onchange = ()=>{
      setVal(cb.dataset.key, cb.checked);
      const drillRow = cb.closest('.drill');
      if(drillRow) drillRow.classList.toggle('ticked', cb.checked);
      const trRow = cb.closest('tr');
      if(trRow) trRow.classList.toggle('ticked', cb.checked);
    };
  });

  document.querySelectorAll('.session-check').forEach(cb=>{
    cb.addEventListener('click', e => e.stopPropagation());
    cb.addEventListener('change', async () => {
      const card = cb.closest('.card');
      if(!card) return;
      const isCoaching = card.dataset.card && card.dataset.card.split(':')[1] === 'coaching';
      if(isCoaching){
        card.classList.toggle('coaching-done', cb.checked);
        if(cb.checked) showCelebration(true);
      } else {
        card.classList.toggle('session-done', cb.checked);
        if(cb.checked){
          const dayInfo = findDayForCardKey(card.dataset.card);
          if(dayInfo && await isDayFullyDone(dayInfo.weekKey, dayInfo.entry)){
            showCelebration();
          }
        }
      }
    });
  });

  document.querySelectorAll('.coach-day-btn').forEach(btn=>{
    btn.onclick = async (e)=>{
      e.stopPropagation();
      const card = btn.closest('.card');
      const cardKey = card.dataset.card;
      const wasSelected = btn.classList.contains('selected');
      const cb = card.querySelector('.session-check');
      if(wasSelected){
        // clicking the already-selected day deselects it
        await setVal(`weekendday:${cardKey}`, null);
        card.querySelectorAll('.coach-day-btn').forEach(b=> b.classList.remove('selected'));
        if(cb){
          cb.checked = false;
          cb.disabled = true;
          card.classList.remove('coaching-done');
          await setVal(`done:${cardKey}:session`, false);
        }
      } else {
        await setVal(`weekendday:${cardKey}`, btn.dataset.day);
        card.querySelectorAll('.coach-day-btn').forEach(b=> b.classList.toggle('selected', b === btn));
        if(cb) cb.disabled = false;
      }
    };
  });

  document.querySelectorAll('input[data-weight]').forEach(inp=>{
    inp.onblur = ()=> setVal(`fbweight:${inp.dataset.weight}`, inp.value);
    inp.oninput = ()=> updateBWDisplay(inp.dataset.weight, inp.value);
  });
  document.querySelectorAll('input[data-rpe]').forEach(inp=>{
    inp.onblur = ()=> setVal(`condrpe:${inp.dataset.rpe}`, inp.value);
  });

  document.querySelectorAll('textarea[data-note]').forEach(ta=>{
    ta.onblur = ()=> setVal(`note:${ta.dataset.note}`, ta.value);
  });

  document.querySelectorAll('button[data-save]').forEach(btn=>{
    btn.onclick = async ()=>{
      const sk = btn.dataset.save;
      const status = document.querySelector(`[data-status="${sk}"]`);
      status.style.opacity = 1;
      setTimeout(()=>{ status.style.opacity = 0; }, 1800);
    };
  });
}

async function hydrateState(){
  const checks = document.querySelectorAll('input[type=checkbox][data-key]');
  for(const cb of checks){
    const v = await getVal(cb.dataset.key, false);
    cb.checked = !!v;
    const drillRow = cb.closest('.drill');
    if(drillRow) drillRow.classList.toggle('ticked', cb.checked);
    const trRow = cb.closest('tr');
    if(trRow) trRow.classList.toggle('ticked', cb.checked);
  }

  for(const card of document.querySelectorAll('.card')){
    const toggle = card.querySelector('.coach-day-toggle');
    if(toggle){
      const cardKey = card.dataset.card;
      const day = await getVal(`weekendday:${cardKey}`, null);
      card.querySelectorAll('.coach-day-btn').forEach(b=>{
        b.classList.toggle('selected', b.dataset.day === day);
      });
      const cb = card.querySelector('.session-check');
      if(cb) cb.disabled = !day;
    }
  }
  const defaultAdded = await getValRaw('defaultAddedWeight', '');
  const weights = document.querySelectorAll('input[data-weight]');
  for(const inp of weights){
    const v = await getVal(`fbweight:${inp.dataset.weight}`, '');
    inp.value = (v !== '' && v !== null && v !== undefined) ? v : (defaultAdded || '');
    updateBWDisplay(inp.dataset.weight, inp.value);
  }
  const rpes = document.querySelectorAll('input[data-rpe]');
  for(const inp of rpes){
    const v = await getVal(`condrpe:${inp.dataset.rpe}`, '');
    inp.value = v || '';
  }
  const notes = document.querySelectorAll('textarea[data-note]');
  for(const ta of notes){
    const v = await getVal(`note:${ta.dataset.note}`, '');
    ta.value = v || '';
  }

  document.querySelectorAll('.session-check').forEach(cb=>{
    const card = cb.closest('.card');
    if(!card) return;
    const isCoaching = card.dataset.card && card.dataset.card.split(':')[1] === 'coaching';
    card.classList.toggle(isCoaching ? 'coaching-done' : 'session-done', cb.checked);
  });
}

// Pull-to-refresh — Home Screen apps on iOS often lose this gesture entirely
// since they run without browser chrome, so we add it back manually.
(function setupPullToRefresh(){
  let startY = null, pulling = false;
  document.addEventListener('touchstart', e=>{
    if(window.scrollY === 0){ startY = e.touches[0].clientY; pulling = true; }
    else{ pulling = false; }
  }, {passive:true});
  document.addEventListener('touchmove', e=>{
    if(!pulling || startY === null) return;
    if(e.touches[0].clientY - startY > 90){ pulling = false; location.reload(); }
  }, {passive:true});
  document.addEventListener('touchend', ()=>{ pulling = false; startY = null; }, {passive:true});
})();
</script>
