<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catalyst Training Companion — Vincent Husset</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

<!-- PWA: installability meta (Android + desktop via dynamic manifest below) -->
<meta name="theme-color" content="#14161A">

<!-- PWA: iPhone-specific home-screen behavior (Safari ignores manifest.json for this) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Catalyst">

<script>
(function(){
  // Single square icon (no separate image file needed) — dark panel bg, orange "C" mark
  const iconSVG = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">'
    + '<rect width="100" height="100" fill="#14161A"/>'
    + '<text x="50" y="70" font-family="Arial, sans-serif" font-weight="900" font-size="62" '
    + 'fill="#FF5A2E" text-anchor="middle">C</text></svg>';
  const iconDataUri = 'data:image/svg+xml;base64,' + btoa(iconSVG);

  // Apple touch icon (iPhone home-screen icon)
  const appleIcon = document.createElement('link');
  appleIcon.rel = 'apple-touch-icon';
  appleIcon.href = iconDataUri;
  document.head.appendChild(appleIcon);

  // Web app manifest (Android/Chrome install prompt) — built at runtime as a
  // Blob so no separate manifest.json file is needed.
  const manifest = {
    name: "Catalyst Training Companion",
    short_name: "Catalyst",
    start_url: "Catalyst.html",
    display: "standalone",
    background_color: "#14161A",
    theme_color: "#14161A",
    icons: [
      { src: iconDataUri, sizes: "192x192", type: "image/svg+xml" },
      { src: iconDataUri, sizes: "512x512", type: "image/svg+xml" }
    ]
  };
  const blob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
  const manifestLink = document.createElement('link');
  manifestLink.rel = 'manifest';
  manifestLink.href = URL.createObjectURL(blob);
  document.head.appendChild(manifestLink);
})();
</script>

<style>
  :root{
    --bg: #000000;
    --panel: #1D2025;
    --panel-alt: #262A30;
    --border: #33383F;
    --text: #ECE8DE;
    --text-dim: #9A9FA6;
    --accent: #FF5A2E;      /* hold orange */
    --accent-dim: #7A2F1B;
    --blue: #49AEDB;        /* video / info */
    --green: #7FD858;       /* complete */
    --gold: #C9A94F;        /* deload */
    --coached: #B565F5;     /* coached wall sessions */
    --pixel-clip-lg: polygon(0 16px,2px 16px,2px 10px,5px 10px,5px 5px,10px 5px,10px 2px,16px 2px,16px 0,
      calc(100% - 16px) 0,calc(100% - 16px) 2px,calc(100% - 10px) 2px,calc(100% - 10px) 5px,

      100% calc(100% - 16px),calc(100% - 2px) calc(100% - 16px),calc(100% - 2px) calc(100% - 10px),
      calc(100% - 5px) calc(100% - 10px),calc(100% - 5px) calc(100% - 5px),calc(100% - 10px) calc(100% - 5px),
      calc(100% - 10px) calc(100% - 2px),calc(100% - 16px) calc(100% - 2px),calc(100% - 16px) 100%,
      16px 100%,16px calc(100% - 2px),10px calc(100% - 2px),10px calc(100% - 5px),5px calc(100% - 5px),
      5px calc(100% - 10px),2px calc(100% - 10px),2px calc(100% - 16px),0 calc(100% - 16px));
    --pixel-clip-sm: polygon(0 8px,1px 8px,1px 5px,3px 5px,3px 3px,5px 3px,5px 1px,8px 1px,8px 0,
      calc(100% - 8px) 0,calc(100% - 8px) 1px,calc(100% - 5px) 1px,calc(100% - 5px) 3px,
      calc(100% - 3px) 3px,calc(100% - 3px) 5px,calc(100% - 1px) 5px,calc(100% - 1px) 8px,100% 8px,
      100% calc(100% - 8px),calc(100% - 1px) calc(100% - 8px),calc(100% - 1px) calc(100% - 5px),
      calc(100% - 3px) calc(100% - 5px),calc(100% - 3px) calc(100% - 3px),calc(100% - 5px) calc(100% - 3px),
      calc(100% - 5px) calc(100% - 1px),calc(100% - 8px) calc(100% - 1px),calc(100% - 8px) 100%,
      8px 100%,8px calc(100% - 1px),5px calc(100% - 1px),5px calc(100% - 3px),3px calc(100% - 3px),
      3px calc(100% - 5px),1px calc(100% - 5px),1px calc(100% - 8px),0 calc(100% - 8px));
    --radius: 10px;
    --display: 'VT323', 'Arial Narrow', monospace;
    --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    overflow-x:hidden;scrollbar-width:none;-ms-overflow-style:none;}
  html::-webkit-scrollbar,body::-webkit-scrollbar{display:none;width:0;height:0;}
  body{padding:0 0 100px 0;}
  body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:1000;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,0.35) 0px,rgba(0,0,0,0.35) 1px,
      transparent 1px,transparent 3px);
    opacity:0.35;}
  .wrap{max-width:920px;margin:0 auto;padding:0 18px;}

  /* header */
  header{background:#000000;}
  .headbar{max-width:920px;margin:0 auto;padding:26px 18px 16px;
    display:flex;align-items:center;justify-content:center;}
  .led-title-wrap{width:100%;}
  .led-title{display:flex;justify-content:center;gap:7px;width:100%;}
  .led-letter{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr);
    gap:2px;flex:1;aspect-ratio:3/4;}
  .led-pixel{border-radius:2px;background:transparent;}
  .led-pixel.on{background:var(--accent);}
  .subtitle{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:0.1em;
    color:#FFFFFF;text-transform:uppercase;}
  .subtitle-box{background:var(--panel-alt);border:1px solid var(--border);clip-path:var(--pixel-clip-lg);
    padding:9px 16px;display:inline-block;margin-top:8px;}
  .meta{text-align:right;font-size:12.5px;color:var(--text-dim);line-height:1.7;}
  .meta b{color:var(--text);font-weight:600;}

  /* week tabs */
  .tabs{display:flex;gap:8px;margin:22px 0 6px;flex-wrap:wrap;}

  /* view switcher (Overview / Sesh) */
  .view-tabs{position:fixed;left:18px;right:18px;bottom:16px;max-width:884px;margin:0 auto;
    display:flex;gap:6px;background:rgba(29,32,37,0.82);backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);border:1px solid var(--border);
    border-radius:18px;padding:4px;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,0.4);}
  .view-tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:4px;font-family:var(--display);font-weight:800;font-size:13px;
    text-transform:uppercase;letter-spacing:0.03em;padding:10px 0 9px;border-radius:14px;cursor:pointer;
    color:rgba(255,255,255,0.8);}
  .view-tab-icon{width:23px;height:23px;}
  .view-tab-icon svg{width:100%;height:100%;}
  .view-tab.active{background:#fff;color:#14161A;}

  /* progress rings */
  .ring-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4px;margin:-6px;}
  .ring-grid > .ring-card:nth-child(5){grid-column:1 / -1;justify-self:center;max-width:50%;}
  .ring-card{display:flex;flex-direction:column;align-items:center;padding:8px 4px;}
  .ring-wrap{position:relative;width:100%;max-width:215px;aspect-ratio:1;margin:0 auto;}
  .ring-svg{width:100%;height:100%;}
  .ring-tick.lit{opacity:1;}
  .ring-tick.dim{opacity:1;stroke:#26282C;}
  .ring-icon-wrap{position:absolute;top:28%;left:28%;width:44%;height:44%;display:flex;
    align-items:center;justify-content:center;z-index:2;}
  .ring-icon-wrap svg{width:100%;height:100%;}
  .ring-label{margin-top:5px;font-family:var(--mono);font-weight:800;font-size:19px;
    text-align:center;}
  .lvl-block{text-align:center;margin:0 0 14px;}
  .vincent-label{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:0.08em;
    color:#FFFFFF;text-transform:uppercase;margin-bottom:8px;}
  .lvl-bar-track{position:relative;height:68px;background:var(--panel-alt);
    clip-path:var(--pixel-clip-lg);margin:16px 0 12px;padding:2px;}
  .lvl-bar-track-inner{position:relative;width:100%;height:100%;background:#000000;
    clip-path:var(--pixel-clip-lg);overflow:hidden;}
  .lvl-bar-leds{position:absolute;inset:0;display:flex;gap:2px;padding:0 2px;z-index:1;}
  .lvl-bar-led{flex:1;height:100%;}
  .lvl-bar-led.lit{animation:ledBarFlicker 3s steps(1) infinite;}
  @keyframes ledBarFlicker{
    0%{background:var(--accent);} 20%{background:var(--blue);} 40%{background:var(--green);}
    60%{background:var(--gold);} 80%{background:var(--coached);} 100%{background:var(--accent);}
  }
  .lvl-bar-led.dim{animation:ledBarFlickerDim 3s steps(1) infinite;}
  @keyframes ledBarFlickerDim{
    0%{background:#202024;} 25%{background:#2a2a2f;} 50%{background:#191a1d;}
    75%{background:#26262b;} 100%{background:#202024;}
  }
  .lvl-bar-label{position:absolute;inset:0;z-index:4;display:flex;align-items:center;justify-content:center;
    font-family:var(--display);font-weight:800;font-size:34px;letter-spacing:0.04em;color:#FFFFFF;
    text-shadow:0 1px 2px rgba(0,0,0,0.9), 0 0 8px rgba(0,0,0,0.6);}

  /* shared boxed-section style (All-Time + This Cycle calendar) */
  .stat-box{background:var(--panel-alt);clip-path:var(--pixel-clip-lg);padding:2px;margin:16px 0;}
  .stat-box-inner{background:#000000;clip-path:var(--pixel-clip-lg);padding:12px;}
  .stat-box-title{font-family:var(--display);font-weight:800;font-size:15px;text-transform:uppercase;
    letter-spacing:0.1em;color:#FFFFFF;margin-bottom:12px;text-align:center;}

  .alltime-row{display:grid;gap:4px;}
  .alltime-row-5{grid-template-columns:repeat(5,1fr);}
  .alltime-stat{text-align:center;}
  .alltime-num{display:block;font-family:var(--mono);font-weight:800;font-size:19px;}
  .alltime-lbl{display:block;font-family:var(--display);font-weight:700;font-size:12px;
    text-transform:uppercase;letter-spacing:0.01em;color:#FFFFFF;margin-top:4px;}
  .alltime-hours{display:block;font-family:var(--mono);font-weight:800;font-size:15px;
    opacity:0.9;margin-top:1px;}

  /* calendar */
  .cal-row{display:grid;grid-template-columns:20px repeat(7,1fr);gap:4px;align-items:center;
    margin-bottom:4px;}
  .cal-daylabel{font-family:var(--mono);font-size:10px;color:var(--text-dim);text-align:center;}
  .cal-weeknum{font-family:var(--mono);font-size:11px;color:var(--text-dim);text-align:center;}
  .cal-box{aspect-ratio:1;clip-path:var(--pixel-clip-sm);background:var(--border);padding:1px;}
  .cal-box-inner{width:100%;height:100%;clip-path:var(--pixel-clip-sm);background:var(--panel-alt);}
  .mini-pixel-letter{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr);
    gap:1px;width:55%;height:70%;margin:15% auto 0;}
  .mini-pixel{background:transparent;}
  .mini-pixel.on{background:var(--text-dim);border-radius:0.5px;}

  /* celebration overlay */
  #celebrationOverlay{position:fixed;top:28%;left:50%;width:90%;max-width:360px;
    transform:translateX(-50%) translateY(14px) scale(0.75) rotate(-2deg);
    font-family:var(--display);font-weight:900;font-size:50px;
    line-height:1.1;text-transform:uppercase;letter-spacing:0.01em;
    background:linear-gradient(90deg,#FF5A2E,#FFD23F,#7FD858,#49AEDB,#B565F5,#FF5A2E);
    background-size:300% 100%;-webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:transparent;
    filter:drop-shadow(0 6px 18px rgba(0,0,0,0.8));
    z-index:200;opacity:0;pointer-events:none;text-align:center;
    transition:opacity .3s ease, transform .5s cubic-bezier(.34,1.56,.64,1);}
  #celebrationOverlay.show{opacity:1;transform:translateX(-50%) translateY(0) scale(1) rotate(0deg);
    animation:rainbowShift 1.8s linear infinite;}
  @keyframes rainbowShift{
    0%{background-position:0% 50%;}
    100%{background-position:100% 50%;}
  }
  .confetti-container{position:fixed;inset:0;pointer-events:none;z-index:199;overflow:hidden;}
  .confetti-piece{position:absolute;top:-24px;width:9px;height:15px;opacity:0.95;border-radius:2px;
    animation-name:confettiFall;animation-timing-function:cubic-bezier(.3,0,.7,1);animation-fill-mode:forwards;}
  @keyframes confettiFall{
    0%{transform:translateY(0) rotate(0deg);opacity:1;}
    100%{transform:translateY(112vh) rotate(var(--rot));opacity:0.25;}
  }

  /* full green fill once ticked */
  .drill.ticked{border:2px solid var(--green);border-radius:8px;margin:0 -8px 0 -8px;padding-left:8px;
    padding-right:8px;}
  tr.ticked td{box-shadow:inset 0 2px 0 var(--green), inset 0 -2px 0 var(--green);}
  tr.ticked td:first-child{box-shadow:inset 0 2px 0 var(--green), inset 0 -2px 0 var(--green), inset 2px 0 0 var(--green);}
  tr.ticked td:last-child{box-shadow:inset 0 2px 0 var(--green), inset 0 -2px 0 var(--green), inset -2px 0 0 var(--green);}

  .tab{font-family:var(--mono);font-weight:700;font-size:13px;padding:9px 14px;border-radius:7px;
    background:var(--panel);border:1px solid var(--border);color:var(--text-dim);cursor:pointer;
    letter-spacing:0.03em;transition:all .12s ease;}
  .tab:hover{border-color:#4a5058;color:var(--text);}
  .tab.active{background:#fff;border-color:#fff;color:#14161A;}
  .tab.week-done{box-shadow:0 0 0 2px var(--green) inset;}
  .tab.deload.active{background:var(--gold);border-color:var(--gold);}

  /* coach note */
  .coachnote{background:var(--panel);border:1px solid var(--border);border-left:4px solid var(--accent);
    border-radius:var(--radius);padding:16px 18px;margin:16px 0 26px;font-size:14.5px;line-height:1.6;}
  .coachnote .tag{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:0.1em;
    font-size:15px;color:var(--accent);margin-bottom:6px;display:block;}
  .coachnote-card{border-left:4px solid #FFFFFF;margin-bottom:22px;}
  .coachnote-card .card-body{white-space:pre-line;font-size:14px;line-height:1.6;}

  /* day structure */
  .day-header{font-family:var(--display);font-weight:800;font-size:17.6px;text-transform:uppercase;
    letter-spacing:0.14em;color:var(--text-dim);margin:26px 0 10px;padding-bottom:7px;
    border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;}
  .day-header:first-of-type{margin-top:4px;}
  .day-header .day-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex-shrink:0;}
  .rest-day{background:var(--panel);border:1px dashed var(--border);border-radius:var(--radius);
    padding:16px;margin-bottom:8px;color:var(--text-dim);font-size:13px;text-align:center;
    font-style:italic;}
  .readonly-banner{background:var(--panel-alt);border:1px solid var(--border);border-radius:8px;
    padding:10px 14px;margin:14px 0 4px;font-size:12.5px;color:var(--text-dim);text-align:center;}

  /* login gate */
  #loginScreen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;
    justify-content:center;padding:20px;z-index:100;}
  .login-card{background:var(--panel-alt);clip-path:var(--pixel-clip-lg);padding:2px;
    max-width:340px;width:100%;}
  .login-card-inner{background:#000000;clip-path:var(--pixel-clip-lg);padding:28px 26px;}
  .login-card .led-title-wrap{margin-bottom:22px;}
  .login-card .led-title{gap:5px;}
  .login-card .led-letter{max-width:28px;}
  .login-card .subtitle{margin-bottom:20px;}
  .login-card input{width:100%;background:var(--panel-alt);border:1px solid var(--border);
    clip-path:var(--pixel-clip-sm);color:var(--text);padding:10px 12px;font-size:16px;margin-bottom:10px;
    font-family:inherit;box-sizing:border-box;}
  .login-card button{width:100%;background:var(--accent);color:#1a0d06;border:none;clip-path:var(--pixel-clip-sm);
    padding:11px;font-weight:800;font-size:17px;cursor:pointer;font-family:var(--display);
    letter-spacing:0.03em;text-transform:uppercase;margin-top:4px;}
  .login-error{color:#FF8A6B;font-size:12.5px;margin-top:10px;min-height:16px;}
  .demo-banner{background:#1E2A24;border:1px solid #2E4A3B;clip-path:var(--pixel-clip-lg);padding:10px 14px;
    margin:16px 0 4px;font-size:12.5px;color:#8FD9AE;text-align:center;}
  .logout-link{font-family:var(--mono);font-size:11px;color:var(--text-dim);cursor:pointer;
    text-decoration:underline;display:inline-block;}
  #pageFooter{text-align:center;padding:24px 18px 40px;}

  /* section card */
  .card{background:var(--panel-alt);clip-path:var(--pixel-clip-lg);padding:2px;
    margin-bottom:14px;transition:background-color .15s ease;}
  .card-inner{background:#000000;clip-path:var(--pixel-clip-lg);overflow:hidden;}
  .card.session-done{background:var(--done-color, var(--green));}
  .card.session-done .card-head{background:var(--done-color-head, rgba(127,216,88,0.5));}
  .card.session-done .card-icon,
  .card.coaching-done .card-icon{color:#FFFFFF !important;}
  .card.coaching-done{background:var(--coached);}
  .card.coaching-done .card-head{background:rgba(181,101,245,0.5);}
  .move-day-btn{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:0.03em;
    padding:4px 8px;border-radius:5px;background:var(--panel-alt);border:1px solid var(--border);
    color:var(--text-dim);cursor:pointer;flex-shrink:0;margin-left:auto;}
  .day-picker{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px;}
  .day-picker-btn{flex:1;min-width:38px;font-family:var(--display);font-weight:800;font-size:12.5px;
    text-transform:uppercase;letter-spacing:0.02em;padding:7px 0;clip-path:var(--pixel-clip-sm);
    background:var(--panel-alt);border:1px solid var(--border);color:var(--text-dim);cursor:pointer;}
  .day-picker-btn.selected{background:#FFFFFF;border-color:#FFFFFF;color:#14161A;}
  .session-check{width:18px;height:18px;accent-color:var(--green);flex-shrink:0;cursor:pointer;margin:0;}
  .card-head{display:flex;flex-direction:column;gap:10px;padding:15px 16px;cursor:pointer;
    user-select:none;}
  .card-head-row{display:flex;align-items:center;gap:9px;}
  .card-head-side{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0;margin-left:auto;align-self:flex-start;}
  .card-head:hover{}
  .code-tag{font-family:var(--mono);font-weight:700;font-size:11.5px;padding:4px 8px;border-radius:5px;
    background:var(--accent-dim);color:#FFB199;letter-spacing:0.03em;white-space:nowrap;}

@keyframes spritecycle-wall{from{-webkit-mask-position:0% 0;mask-position:0% 0;}to{-webkit-mask-position:133.3333% 0;mask-position:133.3333% 0;}}
  
  
  
  .card-icon{width:44px;height:44px;flex-shrink:0;color:#FFFFFF;}
  .card-title{font-family:var(--display);font-weight:800;font-size:22px;text-transform:uppercase;
    letter-spacing:0.02em;flex:1;min-width:0;}
  .card-time{font-family:var(--mono);font-size:12.5px;color:var(--text-dim);white-space:nowrap;flex-shrink:0;}
  .chevron{font-size:12px;color:var(--text-dim);transition:transform .15s ease;}
  .card.open .chevron{transform:rotate(90deg);}
  .card-body{display:none;padding:2px 16px 18px;border-top:1px solid var(--border);}
  .card.open .card-body{display:block;}
  .progress-pill{font-family:var(--mono);font-size:11px;color:var(--text-dim);}
  .progress-pill.done{color:var(--green);}

  /* drill */
  .drill{padding:14px 0;border-bottom:1px solid var(--border);}
  .drill:last-child{border-bottom:none;}
  .drill-row{display:flex;align-items:flex-start;gap:10px;}
  .drill input[type=checkbox]{margin-top:3px;width:17px;height:17px;accent-color:var(--green);flex-shrink:0;cursor:pointer;}
  .drill-name{font-weight:700;font-size:14.5px;}
  .drill-time{font-family:var(--mono);font-size:11.5px;color:var(--text-dim);margin-left:8px;}
  .drill-desc{font-size:13.5px;color:var(--text-dim);margin-top:5px;line-height:1.55;}
  .drill-actions{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .vid-btn{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;
    color:var(--blue);text-decoration:none;border:1px solid #2C4A57;background:#182428;
    padding:6px 10px;border-radius:6px;}
  .vid-btn:hover{background:#1c2e34;}
  .vid-btn{cursor:pointer;font-family:inherit;}
  .vid-embed{display:none;}
  .vid-embed.open{display:block;margin-top:10px;position:relative;width:100%;max-width:420px;
    aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:#000;border:1px solid var(--border);}
  .vid-embed.open iframe{width:100%;height:100%;border:0;display:block;}
  .vid-fallback{font-size:11.5px;color:var(--text-dim);margin-top:6px;}
  .vid-fallback a{color:var(--blue);}

  /* set tables (fingerboard / conditioning) */
  .set-table{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px;}
  .set-table th{text-align:left;font-family:var(--display);font-weight:700;font-size:14px;
    text-transform:uppercase;letter-spacing:0.06em;color:var(--text-dim);padding:6px 8px;
    border-bottom:1px solid var(--border);}
  .set-table td{padding:7px 8px;border-bottom:1px solid #26292E;}
  .set-table tr.rest td{color:var(--text-dim);font-style:italic;font-size:12px;padding:4px 8px;}
  .set-table input[type=text]{width:64px;background:var(--panel-alt);border:1px solid var(--border);
    border-radius:5px;color:var(--text);padding:5px 6px;font-size:16px;font-family:var(--mono);}
  .set-table input[type=checkbox]{accent-color:var(--green);width:16px;height:16px;cursor:pointer;}

  /* projecting */
  .goal-ladder{list-style:none;margin:10px 0;padding:0;counter-reset:goal;}
  .goal-ladder li{counter-increment:goal;padding:8px 0 8px 30px;position:relative;font-size:13.5px;
    border-bottom:1px solid #26292E;}
  .goal-ladder li:last-child{border-bottom:none;}
  .goal-ladder li::before{content:counter(goal);position:absolute;left:0;top:7px;width:20px;height:20px;
    border-radius:50%;background:var(--panel-alt);border:1px solid var(--border);font-family:var(--mono);
    font-size:11px;display:flex;align-items:center;justify-content:center;color:var(--text-dim);}
  .journal{margin-top:14px;background:var(--panel-alt);border:1px solid var(--border);border-radius:8px;
    padding:14px;}
  .journal label{display:block;font-family:var(--display);font-weight:700;font-size:15px;
    text-transform:uppercase;letter-spacing:0.05em;color:var(--accent);margin:10px 0 4px;}
  .journal label:first-child{margin-top:0;}
  .journal textarea{width:100%;background:var(--panel);border:1px solid var(--border);border-radius:6px;
    color:var(--text);padding:8px 10px;font-size:16px;font-family:inherit;resize:vertical;min-height:40px;}
  .journal-save{margin-top:10px;background:var(--accent);color:#1a0d06;border:none;clip-path:var(--pixel-clip-sm);
    padding:8px 14px;font-weight:700;font-size:16px;cursor:pointer;font-family:var(--display);
    letter-spacing:0.03em;text-transform:uppercase;}

<script>
/* ---------- LED DOT-MATRIX TITLE ---------- */
const LED_BITMAPS = {
  C: ['111','100','100','111'],
  A: ['010','101','111','101'],
  T: ['111','010','010','010'],
  L: ['100','100','100','111'],
  Y: ['101','101','010','010'],
  S: ['111','100','011','111'],
  U: ['101','101','101','111'],
  R: ['111','101','110','101'],
  D: ['110','101','101','110'],
  O: ['111','101','101','111'],
  K: ['101','110','110','101'],
  '!': ['010','010','000','010'],
  ' ': ['000','000','000','000']
};
const LED_COLORS = ['#FF5A2E','#49AEDB','#7FD858','#C9A94F','#B565F5'];

function buildLEDLetter(letter){
  const bmp = LED_BITMAPS[letter];
  if(!bmp) return '';
  let cells = '';
  for(const row of bmp){
    for(const bit of row){
      cells += bit === '1'
        ? `<div class="led-pixel on" style="background:${LED_COLORS[Math.floor(Math.random()*LED_COLORS.length)]}"></div>`
        : `<div class="led-pixel"></div>`;
    }
  }
  return `<span class="led-letter">${cells}</span>`;
}
function buildLvlBarLeds(count, litCount){
  let bars = '';
  for(let i=0; i<count; i++){
    const lit = i < litCount;
    bars += `<div class="lvl-bar-led ${lit?'lit':'dim'}" style="animation-delay:-${(Math.random()*3).toFixed(2)}s"></div>`;
  }
  return bars;
}
function miniPixelLetter(letter){
  const bmp = LED_BITMAPS[letter];
  if(!bmp) return '';
  let cells = '';
  for(const row of bmp){
    for(const bit of row){
      cells += bit === '1' ? '<div class="mini-pixel on"></div>' : '<div class="mini-pixel"></div>';
    }
  }
  return `<div class="mini-pixel-letter">${cells}</div>`;
}
function renderLEDTitles(){
  document.querySelectorAll('.led-title[data-word]').forEach(el=>{
    el.innerHTML = el.dataset.word.split('').map(buildLEDLetter).join('');
  });
}
function startLEDFlicker(){
  document.querySelectorAll('.led-pixel.on').forEach(px=>{
    (function loop(){
      const delay = 350 + Math.random()*1200;
      setTimeout(()=>{
        px.style.background = LED_COLORS[Math.floor(Math.random()*LED_COLORS.length)];
        loop();
      }, delay);
    })();
  });
}

/* ---------- VIDEO LINKS ---------- */

function hexToRgba(hex, alpha){
  const h = hex.replace('#','');
  const r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
  return `rgba(${r},${g},${b},${alpha})`;
}
// Maps each session suffix (e.g. "onwall1", "fbmax") to its colour category,
// built from the existing CYCLE_SESSION_KEYS so the two never drift apart.
const SUFFIX_CATEGORY = {};
Object.keys(CYCLE_SESSION_KEYS).forEach(cat=>{
  const catName = cat === 'coachedOnly' ? 'coached' : cat;
  CYCLE_SESSION_KEYS[cat].forEach(k=>{ SUFFIX_CATEGORY[k.split(':')[2]] = catName; });
});
function catBoxBackground(categories){
  if(!categories || !categories.length) return '';
  const uniq = Array.from(new Set(categories));
  if(uniq.length === 1){
    const hex = CATEGORY_HEX[uniq[0]] || '#7FD858';
    return `background:${hex};border-color:${hex};`;
  }
  const step = 100/uniq.length;
  const stops = uniq.map((c,i)=>`${CATEGORY_HEX[c] || '#7FD858'} ${(i*step).toFixed(3)}% ${((i+1)*step).toFixed(3)}%`).join(',');
  return `background:linear-gradient(90deg,${stops});border-color:transparent;`;
}
function applyCardDoneColor(card){

    card.style.setProperty('--done-color-head', hexToRgba(hex, 0.5));
  }
}

async function countTrue(keys){

}
async function anyTrue(keys){

}

  for(const k of keys){
    if(await getVal(k, false)) min += SESSION_DURATION_MIN[suffixFromSessionKey(k)] || 0;
  }
  return min/60;
}
async function getAllCustomSessions(){
  // Custom ("Add Sesh") entries only exist for the 4 working weeks of a
  // cycle — the deload week (w5) has no on-the-wall/finger/cond work.
  let all = [];
  for(let w=1; w<=4; w++){
    const list = await getValRaw(`customSessions:w${w}`, []);
    list.forEach(item => all.push(item));
  }
  return all;
}
async function computeCycleCounts(){
  const customs = await getAllCustomSessions();
  const customCount = t => customs.filter(c=>c.type===t).length;
  const customHours = t => customCount(t) * ((CUSTOM_DURATION_MIN[t]||0)/60);

  const wall = await countTrue(CYCLE_SESSION_KEYS.wall) + customCount('wall');
  const fingerboard = await countTrue(CYCLE_SESSION_KEYS.fingerboard) + customCount('fingerboard');
  const conditioning = await countTrue(CYCLE_SESSION_KEYS.conditioning) + customCount('conditioning');
  const stretching = await countTrue(CYCLE_SESSION_KEYS.stretching) + customCount('stretching');
  const coached = await countTrue(CYCLE_SESSION_KEYS.coachedOnly) + customCount('coached');
  const wallHours = await categoryHours(CYCLE_SESSION_KEYS.wall) + customHours('wall');
  const fingerboardHours = await categoryHours(CYCLE_SESSION_KEYS.fingerboard) + customHours('fingerboard');
  const conditioningHours = await categoryHours(CYCLE_SESSION_KEYS.conditioning) + customHours('conditioning');
  const stretchingHours = await categoryHours(CYCLE_SESSION_KEYS.stretching) + customHours('stretching');
  const coachedHours = await categoryHours(CYCLE_SESSION_KEYS.coachedOnly) + customHours('coached');
  return { wall, fingerboard, conditioning, stretching, coached,
           wallHours, fingerboardHours, conditioningHours, stretchingHours, coachedHours,

async function computeCalendarGrid(){
  const grid = [];
  const allSlots = Object.keys(SESSION_DEFAULT_DAY);
  for(let w=1; w<=5; w++){
    const wk = `w${w}`;
    if(w === 5){
      grid.push(DAY_KEYS.map(() => ({rest:true, categories:[]})));
      continue;
    }
    const customs = await getValRaw(`customSessions:${wk}`, []);
    const dayCats = [new Set(),new Set(),new Set(),new Set(),new Set(),new Set(),new Set()];
    for(const suffix of allSlots){
      if(await getVal(`done:${wk}:${suffix}:session`, false)){
        const cat = SUFFIX_CATEGORY[suffix];
        if(cat){
          const di = await getSlotDayIdx(wk, suffix);
          dayCats[di].add(cat);
        }
      }
    }
    for(let i=0; i<7; i++){
      customs.filter(c=>c.day===DAY_KEYS[i]).forEach(c=> dayCats[i].add(c.type));
    }
    const row = [];
    for(let i=0; i<7; i++){
      if(i === 3 && dayCats[i].size === 0){ row.push({rest:true, categories:[]}); continue; }
      row.push({rest:false, categories:Array.from(dayCats[i])});
    }
    grid.push(row);
  }
  return grid;
}
async function findDayForCardKey(cardKey){
  const [wk, suffix] = cardKey.split(':');
  if(!wk || !suffix || !(suffix in SESSION_DEFAULT_DAY)) return null;
  const di = await getSlotDayIdx(wk, suffix);
  const allSlots = Object.keys(SESSION_DEFAULT_DAY);
  const cardKeys = [];
  for(const sk of allSlots){
    if((await getSlotDayIdx(wk, sk)) === di) cardKeys.push(sk);
  }
  return {weekKey: wk, entry: {cardKeys}};
}
async function isDayFullyDone(weekKey, entry){
  if(!entry.cardKeys.length) return false;
  for(const suffix of entry.cardKeys){
    if(!(await getVal(`done:${weekKey}:${suffix}:session`, false))) return false;
  }
  return true;
}

const STORAGE_PREFIX = 'catalyst_companion:';
// Every plan cycle gets its own permanent namespace, so uploading next
// month's plan can never overwrite or collide with this month's history.

function cycleKey(key){ return `${window.CYCLE_ID}:${key}`; }

async function getVal(key, fallback){
  const fullKey = cycleKey(key);
  if(storageBackend === 'memory'){
    return Object.prototype.hasOwnProperty.call(memoryStore, fullKey) ? memoryStore[fullKey] : fallback;
  }
  try{
    const v = localStorage.getItem(STORAGE_PREFIX + fullKey);
    return v === null ? fallback : JSON.parse(v);
  }catch(e){ return fallback; }
}
async function setVal(key, val){
  const fullKey = cycleKey(key);
  if(storageBackend === 'memory'){
    memoryStore[fullKey] = val;
    return;
  }

  catch(e){ console.error("storage set failed", e); }
}

function animateNumber(el, target, suffix){
  suffix = suffix || '';
  const duration = 750;
  const start = performance.now();
  function step(now){
    const t = Math.min(1, (now-start)/duration);
    const eased = 1 - Math.pow(1-t, 3);
    el.textContent = Math.round(target*eased) + suffix;
    if(t < 1) requestAnimationFrame(step);
    else el.textContent = target + suffix;
  }
  requestAnimationFrame(step);
}

function ringSVG(value, max, colorVar, ringId){
  const pct = max > 0 ? Math.min(1, value/max) : 0;
  const N = 96;
  const litCount = Math.round(pct * N);
  const cx = 50, cy = 50, rOuter = 45, rInner = 33;
  let ticks = '';
  for(let i=0; i<N; i++){
    const angle = (i * 360/N - 90) * Math.PI/180;
    const x1 = (cx + rInner*Math.cos(angle)).toFixed(2);
    const y1 = (cy + rInner*Math.sin(angle)).toFixed(2);
    const x2 = (cx + rOuter*Math.cos(angle)).toFixed(2);
    const y2 = (cy + rOuter*Math.sin(angle)).toFixed(2);
    ticks += `<line class="ring-tick dim" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"
      stroke="#3A3D42" stroke-width="1.6" stroke-linecap="round" style="animation-delay:${(i*0.025).toFixed(2)}s"/>`;
  }
  return `<svg viewBox="0 0 100 100" class="ring-svg" data-lit-count="${litCount}" data-color="${colorVar}" data-n="${N}">${ticks}</svg>`;
}
let idleChaseTimers = [];
function stopIdleChases(){
  idleChaseTimers.forEach(id => clearTimeout(id));
  idleChaseTimers = [];
}
function resolveColorVar(str){
  const m = /var\((--[a-zA-Z0-9-]+)\)/.exec(str);
  if(!m) return str;
  return getComputedStyle(document.documentElement).getPropertyValue(m[1]).trim();
}
function hexToHsl(hex){
  const r = parseInt(hex.slice(1,3),16)/255, g = parseInt(hex.slice(3,5),16)/255, b = parseInt(hex.slice(5,7),16)/255;
  const max = Math.max(r,g,b), min = Math.min(r,g,b);
  let h, s, l = (max+min)/2;
  if(max === min){ h = s = 0; }
  else {
    const d = max-min;
    s = l > 0.5 ? d/(2-max-min) : d/(max+min);
    if(max===r) h = (g-b)/d + (g<b?6:0);
    else if(max===g) h = (b-r)/d + 2;
    else h = (r-g)/d + 4;
    h /= 6;
  }
  return [h*360, s*100, l*100];
}
function hslToHex(h,s,l){
  s/=100; l/=100;
  const k = n => (n+h/30)%12;
  const a = s*Math.min(l,1-l);
  const f = n => l - a*Math.max(-1, Math.min(k(n)-3, Math.min(9-k(n),1)));
  const toHex = x => Math.round(255*Math.max(0,Math.min(1,x))).toString(16).padStart(2,'0');
  return `#${toHex(f(0))}${toHex(f(8))}${toHex(f(4))}`;
}
function runLitFlicker(svg){
  const baseHex = resolveColorVar(svg.dataset.color);
  const [h, s, l] = hexToHsl(baseHex);
  // luminosity variants only — same hue/saturation throughout, so orange stays orange-red
  const shades = [-14, -5, 6, 14].map(delta => hslToHex(h, s, Math.max(15, Math.min(85, l+delta))));
  const litTicks = Array.from(svg.querySelectorAll('.ring-tick.lit'));
  let frame = 0;
  function step(){
    litTicks.forEach((el,i)=>{
      const shadeIdx = (Math.floor(frame/6) + i) % shades.length;
      el.setAttribute('stroke', shades[shadeIdx]);
    });
    frame++;
    idleChaseTimers.push(setTimeout(step, 45));
  }
  step();
}
const RING_DIM_SHADES = ['#202024', '#2a2a2f', '#191a1d', '#26262b'];
function runIdleGreyChase(svg, litCount, N){
  const allTicks = Array.from(svg.querySelectorAll('.ring-tick'));
  const bandWidth = 12;
  let pos = 0;
  let frame = 0;
  function step(){
    allTicks.forEach((el,i)=>{
      if(el.classList.contains('lit')) return;
      const dist = (i - pos + N) % N;
      if(dist < bandWidth){
        el.style.stroke = '#5A5D64';
      } else {
        const shadeIdx = (Math.floor(frame/8) + i) % RING_DIM_SHADES.length;
        el.style.stroke = RING_DIM_SHADES[shadeIdx];
      }
    });
    pos = (pos + 1) % N;
    frame++;
    idleChaseTimers.push(setTimeout(step, 45));
  }
  step();
}
function runRingChase(svg){
  const N = parseInt(svg.dataset.n, 10);
  const litCount = parseInt(svg.dataset.litCount, 10);
  const color = svg.dataset.color;
  const ticks = Array.from(svg.querySelectorAll('.ring-tick'));
  const chaseWidth = Math.max(6, Math.round(N/10));
  const totalSteps = Math.min(60, Math.max(20, litCount * 4));
  const laps = 3;
  let step = 0;
  // Remove dim/lit during the chase so the idle CSS flicker can't fight
  // these per-frame JS colors — classes get cleanly reapplied at settle.
  ticks.forEach(el => el.classList.remove('dim', 'lit'));
  function easeOut(t){ return 1 - Math.pow(1-t, 3); }
  function frame(){
    if(step >= totalSteps){
      ticks.forEach((el,i)=>{
        const on = i < litCount;
        el.classList.toggle('lit', on);
        el.classList.toggle('dim', !on);
        if(on){
          el.setAttribute('stroke', color);
          el.removeAttribute('stroke-opacity');
        } else {
          el.setAttribute('stroke', '#3A3D42');
          el.removeAttribute('stroke-opacity');
        }
      });
      runLitFlicker(svg);
      runIdleGreyChase(svg, litCount, N);
      return;
    }
    const t = step/totalSteps;
    // Fill count grows LINEARLY with elapsed time — each of the litCount
    // segments lands at an evenly-spaced moment, so the animation always
    // ends on its true final step rather than stalling then jumping.
    const filled = Math.floor(t * litCount);
    // The decorative comet still uses an eased curve for its own spin —
    // that part is purely visual flair, not tied to the real value.
    const eased = easeOut(t);
    const chasePos = Math.floor(eased * laps * N) % N;
    ticks.forEach((el,i)=>{
      if(i < filled){
        el.setAttribute('stroke', color);
      } else {
        const inChase = ((i - chasePos + N) % N) < chaseWidth;
        el.setAttribute('stroke', inChase ? color : '#3A3D42');
      }
    });
    step++;
    setTimeout(frame, 20);
  }
  frame();
}

function spawnConfetti(){
  const colors = ['#FF5A2E','#FFD23F','#7FD858','#49AEDB','#B565F5'];
  const container = document.createElement('div');
  container.className = 'confetti-container';
  for(let i=0; i<180; i++){
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = (Math.random()*100) + 'vw';
    piece.style.background = colors[Math.floor(Math.random()*colors.length)];

}

let vidSeq = 0;
function toEmbedUrl(url){
  let id = '';
  if(url.includes('youtu.be/')) id = url.split('youtu.be/')[1].split('?')[0];
  else if(url.includes('watch?v=')) id = url.split('watch?v=')[1].split('&')[0];
  return {embed: `https://www.youtube.com/embed/${id}`, watch: `https://www.youtube.com/watch?v=${id}`};
}
function vidButton(url, label){
  label = label || '▶ Watch demo';
  const id = 'vidembed' + (vidSeq++);
  const {embed, watch} = toEmbedUrl(url);
  return `<button type="button" class="vid-btn" data-embed="${embed}" data-watch="${watch}" data-target="${id}" data-label="${label}">${label}</button><div class="vid-embed" id="${id}"></div>`;
}

async function updateBWDisplay(skey, weightValue){
  const span = document.querySelector(`.fb-bw-pct[data-bw-for="${skey}"]`);

function attachCustomSeshHandlers(weekKey){
  let selectedType = 'wall';
  let selectedDay = 'mon';

  const typeBtns = document.querySelectorAll('.add-sesh-type-btn');
  typeBtns.forEach(btn=>{
    btn.onclick = ()=>{
      selectedType = btn.dataset.type;
      typeBtns.forEach(b=> b.classList.toggle('selected', b === btn));
    };
  });

  const dayBtns = document.querySelectorAll('.add-sesh-day-btn');
  dayBtns.forEach(btn=>{
    btn.onclick = ()=>{
      selectedDay = btn.dataset.day;
      dayBtns.forEach(b=> b.classList.toggle('selected', b === btn));
    };
  });

  const btn = document.getElementById('addSeshBtn');
  if(btn){
    btn.onclick = async ()=>{
      const list = await getValRaw(`customSessions:${weekKey}`, []);
      list.push({ id: `custom_${Date.now()}_${Math.random().toString(36).slice(2,7)}`, type: selectedType, day: selectedDay });
      await setValRaw(`customSessions:${weekKey}`, list);
      renderContent();
    };
  }
  document.querySelectorAll('[data-remove-custom]').forEach(rmBtn=>{
    rmBtn.onclick = async ()=>{
      const id = rmBtn.dataset.removeCustom;
      const list = await getValRaw(`customSessions:${weekKey}`, []);
      const next = list.filter(x => x.id !== id);
      await setValRaw(`customSessions:${weekKey}`, next);
      renderContent();
    };
  });
}

async function renderContent(){
  const wk = WEEKS[currentWeek];
  const weekKey = `w${currentWeek}`;

  if(wk.deload){
    const customsDeload = await getValRaw(`customSessions:${weekKey}`, []);
    contentEl.innerHTML = `
      ${wk.coachNote ? coachNoteCardHTML(weekKey, currentWeek, wk.coachNote) : ''}
      <div class="deload-msg">
        <div class="big">Deload Week</div>
        <p>No on-the-wall, conditioning or fingerboard work this week. Just three stretching sessions to recover — then get in touch with Dave (enquiries@catalystclimbing.com) to arrange your next cycle.</p>
      </div>
      <div style="margin-top:14px;">
        ${stretchCardHTML(weekKey, 'stretch1', stretchSession(1), VID.STRETCH_UPPER)}
        ${stretchCardHTML(weekKey, 'stretch2', stretchSession(2), VID.STRETCH_LOWER)}
        ${stretchCardHTML(weekKey, 'stretch3', stretchSession(3), VID.STRETCH_LOWER)}
      </div>
      <div style="margin-top:18px;">
        ${customsDeload.map(item => customSeshCardHTML(weekKey, item)).join('')}
        ${addSeshSectionHTML()}
      </div>`;
    attachHandlers();
    hydrateState();
    attachCustomSeshHandlers(weekKey);
    return;
  }

  let html = '';
  if(wk.coachNote){
    html += coachNoteCardHTML(weekKey, currentWeek, wk.coachNote);
  }

  const slotRenderers = {
    onwall1: (di) => onWallCardHTML(`${weekKey}:onwall1`, wk.onWall1, 'onwall1', di),
    stretch1: (di) => stretchCardHTML(weekKey, 'stretch1', wk.stretch1, VID.STRETCH_UPPER, di),
    fbmax: (di) => fingerboardCardHTML(weekKey, 'fbmax', wk.fbMax, di),
    onwallclass: (di) => onWallCardHTML(`${weekKey}:onwallclass`, wk.onWallClass, 'onwallclass', di),
    fbrep: (di) => fingerboardCardHTML(weekKey, 'fbrep', wk.fbRep, di),
    onwall3: (di) => onWallCardHTML(`${weekKey}:onwall3`, wk.onWall3, 'onwall3', di),
    stretch2: (di) => stretchCardHTML(weekKey, 'stretch2', wk.stretch2, VID.STRETCH_LOWER, di),
    conditioning: (di) => conditioningCardHTML(weekKey, wk.conditioning, di),
    coaching: (di) => coachingCardHTML(weekKey, di),
  };

  const slotKeys = Object.keys(slotRenderers);
  const dayBuckets = [[],[],[],[],[],[],[]];
  for(const sk of slotKeys){
    const di = await getSlotDayIdx(weekKey, sk);
    dayBuckets[di].push(sk);
  }

  for(let di=0; di<7; di++){
    const label = DAY_LABEL_FULL[DAY_KEYS[di]];
    const slots = dayBuckets[di];
    html += `<div class="day-section" data-day-idx="${di}">`;
    if(di === 3 && slots.length === 0){
      html += restDayHTML(label);
      html += `</div>`;
      continue;
    }
    html += dayHeader(label);
    for(const sk of slots){
      html += slotRenderers[sk](di);
    }
    html += `</div>`;
  }

  const customsList = await getValRaw(`customSessions:${weekKey}`, []);
  html += `<div style="margin-top:18px;">
    ${customsList.map(item => customSeshCardHTML(weekKey, item)).join('')}
    ${addSeshSectionHTML()}
  </div>`;

  contentEl.innerHTML = html;
  attachHandlers();
  hydrateState();
  attachCustomSeshHandlers(weekKey);
}

/* ---------- INTERACTIVITY ---------- */
function attachHandlers(){
  document.querySelectorAll('.card-head').forEach(h=>{
    h.onclick = ()=>{
      const card = h.closest('.card');
      const key = card.dataset.card;
      const isOpen = openCards.has(key);
      if(isOpen){
        openCards.delete(key);
        card.classList.remove('open');
      } else {
        document.querySelectorAll('.card.open').forEach(c=>{
          if(c !== card){ openCards.delete(c.dataset.card); c.classList.remove('open'); }
        });
        openCards.add(key);
        card.classList.add('open');
      }
    };
  });

  document.querySelectorAll('.vid-btn[data-embed]').forEach(btn=>{
    btn.onclick = ()=>{
      const target = document.getElementById(btn.dataset.target);
      const wasOpen = target.classList.contains('open');

      // close every other open video first (accordion behaviour)
      document.querySelectorAll('.vid-btn[data-embed]').forEach(otherBtn=>{
        if(otherBtn === btn) return;
        const otherTarget = document.getElementById(otherBtn.dataset.target);
        if(otherTarget && otherTarget.classList.contains('open')){
          otherTarget.classList.remove('open');
          otherTarget.innerHTML = '';
          const otherFallback = otherTarget.nextElementSibling && otherTarget.nextElementSibling.classList.contains('vid-fallback')
            ? otherTarget.nextElementSibling : null;
          if(otherFallback) otherFallback.remove();
          otherBtn.textContent = otherBtn.dataset.label;
        }
      });

      const existingFallback = target.nextElementSibling && target.nextElementSibling.classList.contains('vid-fallback')
        ? target.nextElementSibling : null;
      if(wasOpen){
        target.classList.remove('open');
        target.innerHTML = '';
        if(existingFallback) existingFallback.remove();
        btn.textContent = btn.dataset.label;
      } else {
        target.classList.add('open');
        target.innerHTML = `<iframe src="${btn.dataset.embed}?autoplay=1&playsinline=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
        btn.textContent = btn.dataset.label.replace('▶', '▼').replace(/Watch/i, 'Hide');
        const fallback = document.createElement('div');
        fallback.className = 'vid-fallback';
        fallback.innerHTML = `Video blocked here? <a href="${btn.dataset.watch}" target="_blank" rel="noopener">Open on YouTube instead ↗</a>`;
        target.after(fallback);
      }
    };
  });

  document.querySelectorAll('input[type=checkbox][data-key]').forEach(cb=>{
    cb.onchange = ()=>{
      setVal(cb.dataset.key, cb.checked);
      const drillRow = cb.closest('.drill');
      if(drillRow) drillRow.classList.toggle('ticked', cb.checked);
      const trRow = cb.closest('tr');
      if(trRow) trRow.classList.toggle('ticked', cb.checked);

      // If this was an individual exercise checkbox (not the session master
      // checkbox itself), see if every exercise in the card is now done —
      // if so, auto-check the session too.
      if(!cb.classList.contains('session-check')){
        const card = cb.closest('.card');
        if(card){
          const sessionCb = card.querySelector('.session-check');
          const exerciseChecks = Array.from(card.querySelectorAll('.card-body input[type=checkbox][data-key]'));
          if(sessionCb && exerciseChecks.length > 0){
            const allDone = exerciseChecks.every(x => x.checked);
            if(allDone && !sessionCb.checked){
              sessionCb.checked = true;
              sessionCb.dispatchEvent(new Event('change'));
            }
          }
        }
      }
    };
  });

  document.querySelectorAll('.session-check').forEach(cb=>{
    cb.addEventListener('click', e => e.stopPropagation());
    cb.addEventListener('change', async () => {
      const card = cb.closest('.card');
      if(!card) return;
      const isCoaching = card.dataset.card && card.dataset.card.split(':')[1] === 'coaching';
      if(isCoaching){
        card.classList.toggle('coaching-done', cb.checked);
        if(cb.checked) showCelebration(true);
      } else {
        applyCardDoneColor(card);
        card.classList.toggle('session-done', cb.checked);
        if(cb.checked){
          const dayInfo = await findDayForCardKey(card.dataset.card);
          if(dayInfo && await isDayFullyDone(dayInfo.weekKey, dayInfo.entry)){
            showCelebration();
          }
        }
      }
    });
  });

  document.querySelectorAll('.move-day-btn').forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      const card = btn.closest('.card');
      const picker = card.querySelector('.day-picker');
      if(picker) picker.style.display = picker.style.display === 'none' ? 'flex' : 'none';
    };
  });

  document.querySelectorAll('.day-picker-btn').forEach(btn=>{
    btn.onclick = async (e)=>{
      e.stopPropagation();
      const card = btn.closest('.card');
      const weekKey = card.dataset.card.split(':')[0];
      const slotKey = btn.dataset.slot;
      const day = btn.dataset.day;
      await setVal(`dayslot:${weekKey}:${slotKey}`, day);
      renderContent();
    };
  });

  document.querySelectorAll('input[data-weight]').forEach(inp=>{
    inp.onblur = ()=> setVal(`fbweight:${inp.dataset.weight}`, inp.value);
    inp.oninput = ()=> updateBWDisplay(inp.dataset.weight, inp.value);
  });
  document.querySelectorAll('input[data-rpe]').forEach(inp=>{
    inp.onblur = ()=> setVal(`condrpe:${inp.dataset.rpe}`, inp.value);
  });

  document.querySelectorAll('textarea[data-note]').forEach(ta=>{
    ta.onblur = ()=> setVal(`note:${ta.dataset.note}`, ta.value);
  });

  document.querySelectorAll('button[data-save]').forEach(btn=>{
    btn.onclick = async ()=>{
      const sk = btn.dataset.save;
      const status = document.querySelector(`[data-status="${sk}"]`);
      status.style.opacity = 1;
      setTimeout(()=>{ status.style.opacity = 0; }, 1800);
    };
  });
}

async function hydrateState(){
  const checks = document.querySelectorAll('input[type=checkbox][data-key]');
  for(const cb of checks){
    const v = await getVal(cb.dataset.key, false);
    cb.checked = !!v;
    const drillRow = cb.closest('.drill');
    if(drillRow) drillRow.classList.toggle('ticked', cb.checked);
    const trRow = cb.closest('tr');
    if(trRow) trRow.classList.toggle('ticked', cb.checked);
  }

  const defaultAdded = await getValRaw('defaultAddedWeight', '');
  const weights = document.querySelectorAll('input[data-weight]');
  for(const inp of weights){
    const v = await getVal(`fbweight:${inp.dataset.weight}`, '');
    inp.value = (v !== '' && v !== null && v !== undefined) ? v : (defaultAdded || '');
    updateBWDisplay(inp.dataset.weight, inp.value);
  }
  const rpes = document.querySelectorAll('input[data-rpe]');
  for(const inp of rpes){
    const v = await getVal(`condrpe:${inp.dataset.rpe}`, '');
    inp.value = v || '';
  }
  const notes = document.querySelectorAll('textarea[data-note]');
  for(const ta of notes){
    const v = await getVal(`note:${ta.dataset.note}`, '');
    ta.value = v || '';
  }

  document.querySelectorAll('.session-check').forEach(cb=>{
    const card = cb.closest('.card');
    if(!card) return;
    const isCoaching = card.dataset.card && card.dataset.card.split(':')[1] === 'coaching';
    if(!isCoaching) applyCardDoneColor(card);
    card.classList.toggle(isCoaching ? 'coaching-done' : 'session-done', cb.checked);
  });
}

// The app no longer starts itself on page load — login gates everything.
// The auth module (below) calls this once it knows who's logged in.
window.startApp = function(mode){
  storageBackend = mode === 'real' ? 'local' : 'memory';
  if(mode === 'demo'){
    const demoBanner = document.getElementById('demoBanner');
    if(demoBanner){
      demoBanner.innerHTML = `<div class="demo-banner">🧪 Demo mode — click around freely, nothing here is saved.</div>`;
    }
  }
  loadUIState();
  renderViewTabs();
  renderTabs();
  renderContent();
  document.getElementById('overviewContent').style.display = currentView==='overview' ? '' : 'none';
  document.getElementById('sessionArea').style.display = currentView==='sesh' ? '' : 'none';
  if(currentView === 'overview') renderOverview();
};

// Pull-to-refresh — Home Screen apps on iOS often lose this gesture entirely
// since they run without browser chrome, so we add it back manually.
(function setupPullToRefresh(){
  let startY = null, pulling = false;
  document.addEventListener('touchstart', e=>{
    if(window.scrollY === 0){ startY = e.touches[0].clientY; pulling = true; }
    else{ pulling = false; }
  }, {passive:true});
  document.addEventListener('touchmove', e=>{
    if(!pulling || startY === null) return;
    if(e.touches[0].clientY - startY > 90){ pulling = false; location.reload(); }
  }, {passive:true});
  document.addEventListener('touchend', ()=>{ pulling = false; startY = null; }, {passive:true});
})();
</script>

<script type="module">

    const { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } =
      await import("https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js");

    const firebaseConfig = {
      apiKey: "AIzaSyCqRlaNZhPMhQoQHxoO2b6wAa-DYuOcGvQ",
      authDomain: "catalysttraining.firebaseapp.com",
      projectId: "catalysttraining",
      storageBucket: "catalysttraining.firebasestorage.app",
      messagingSenderId: "1036567541586",
      appId: "1:1036567541586:web:7f4d3ab61f0b27216d6c8b"
    };
    const MY_UID = "G3SenM8rFvTA7Fh32zszFw9bIOY2";
    const PREFIX = 'catalyst_companion:';

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        showLogin();

      showApp();
      const isReal = user.uid === MY_UID;

      if (isReal) {
        // Pull whatever's saved in the cloud into local storage first
        try {
          const snap = await getDoc(progressDocRef);
          if (snap.exists()) {
            const remote = snap.data() || {};
            Object.keys(remote).forEach(k => {
              try {
                const localKey = k.startsWith('raw:') ? k.slice(4) : k;
                localStorage.setItem(PREFIX + localKey, JSON.stringify(remote[k]));
              } catch (e) {}
            });
          }
        } catch (e) {
          console.warn('Cloud load failed, starting from local cache.', e);
        }

        window.startApp('real');

        // Upgrade setVal so every future save also pushes to the cloud
        const originalSetVal = window.setVal;
        window.setVal = async function (key, val) {
          await originalSetVal(key, val);
          try {
            const fullKey = `${window.CYCLE_ID}:${key}`;
            await setDoc(progressDocRef, { [fullKey]: val }, { merge: true });
          } catch (e) {
            console.warn('Cloud sync write failed, saved locally only.', e);
          }
        };
        const originalSetValRaw = window.setValRaw;
        window.setValRaw = async function (rawKey, val) {
          await originalSetValRaw(rawKey, val);
          try {
            await setDoc(progressDocRef, { [`raw:${rawKey}`]: val }, { merge: true });
          } catch (e) {
            console.warn('Cloud sync write failed, saved locally only.', e);
          }
        };
        console.log('Logged in as Vincent — cloud sync active.');
      } else {
        // Any other account: fully interactive demo, nothing persists anywhere
        window.startApp('demo');
        console.log('Logged in as demo — nothing will be saved.');
      }
    });
  } catch (e) {
    console.error('Firebase failed to load — login unavailable.', e);
    loginError.textContent = 'Connection error — please check your internet and reload.';
  }
</script>
