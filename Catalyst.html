<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catalyst Training Companion — Vincent Husset</title>
<style>
  :root{
    --bg: #14161A;
    --panel: #1D2025;
    --panel-alt: #262A30;
    --border: #33383F;
    --text: #ECE8DE;
    --text-dim: #9A9FA6;
    --accent: #FF5A2E;      /* hold orange */
    --accent-dim: #7A2F1B;
    --blue: #49AEDB;        /* video / info */
    --green: #7FD858;       /* complete */
    --gold: #C9A94F;        /* deload */
    --radius: 10px;
    --display: 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
    --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;}
  body{padding:0 0 60px 0;}
  .wrap{max-width:920px;margin:0 auto;padding:0 18px;}

  /* header */
  header{border-bottom:1px solid var(--border);background:
    linear-gradient(180deg, #191B1F 0%, #14161A 100%);}
  .headbar{max-width:920px;margin:0 auto;padding:26px 18px 20px;
    display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:14px;}
  .wordmark{font-family:var(--display);font-weight:800;font-size:34px;letter-spacing:0.03em;
    text-transform:uppercase;line-height:0.9;}
  .wordmark span{color:var(--accent);}
  .subtitle{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:0.22em;
    color:var(--text-dim);text-transform:uppercase;margin-top:4px;}
  .meta{text-align:right;font-size:12.5px;color:var(--text-dim);line-height:1.7;}
  .meta b{color:var(--text);font-weight:600;}

  /* week tabs */
  .tabs{display:flex;gap:8px;margin:22px 0 6px;flex-wrap:wrap;}

  /* view switcher (Overview / Sesh) */
  .view-tabs{display:flex;gap:6px;margin:20px 0 4px;background:var(--panel);border:1px solid var(--border);
    border-radius:10px;padding:4px;}
  .view-tab{flex:1;text-align:center;font-family:var(--display);font-weight:800;font-size:13px;
    text-transform:uppercase;letter-spacing:0.04em;padding:10px 0;border-radius:7px;cursor:pointer;
    color:var(--text-dim);}
  .view-tab.active{background:var(--accent);color:#1a0d06;}

  /* progress rings */
  .ring-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0 6px;}
  .ring-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    padding:16px 10px;display:flex;flex-direction:column;align-items:center;}
  .ring-wrap{position:relative;width:96px;height:96px;}
  .ring-svg{width:100%;height:100%;}
  .ring-value{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-weight:700;font-size:15px;}
  .ring-label{margin-top:10px;font-family:var(--display);font-weight:700;font-size:11.5px;
    text-transform:uppercase;letter-spacing:0.04em;color:var(--text-dim);text-align:center;}
  .hero-stat{text-align:center;margin:18px 0 4px;}
  .hero-stat .num{font-family:var(--display);font-weight:800;font-size:34px;color:var(--accent);
    line-height:1;}
  .hero-stat .lbl{font-family:var(--display);font-weight:700;font-size:11px;text-transform:uppercase;
    letter-spacing:0.12em;color:var(--text-dim);margin-top:4px;}

  /* all-time strip */
  .alltime-block{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    padding:16px;margin:20px 0;}
  .alltime-title{font-family:var(--display);font-weight:800;font-size:11.5px;text-transform:uppercase;
    letter-spacing:0.1em;color:var(--text-dim);margin-bottom:10px;text-align:center;}
  .alltime-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .alltime-stat{text-align:center;}
  .alltime-num{display:block;font-family:var(--mono);font-weight:700;font-size:20px;}
  .alltime-lbl{display:block;font-family:var(--display);font-weight:600;font-size:9.5px;
    text-transform:uppercase;letter-spacing:0.03em;color:var(--text-dim);margin-top:2px;}

  /* calendar */
  .calendar-block{max-width:300px;margin:22px auto 8px;}
  .calendar-title{font-family:var(--display);font-weight:800;font-size:11.5px;text-transform:uppercase;
    letter-spacing:0.1em;color:var(--text-dim);margin-bottom:10px;text-align:center;}
  .cal-row{display:grid;grid-template-columns:20px repeat(7,1fr);gap:4px;align-items:center;
    margin-bottom:4px;}
  .cal-daylabel{font-family:var(--mono);font-size:10px;color:var(--text-dim);text-align:center;}
  .cal-weeknum{font-family:var(--mono);font-size:11px;color:var(--text-dim);text-align:center;}
  .cal-box{aspect-ratio:1;border-radius:5px;background:var(--panel-alt);border:1px solid var(--border);}
  .cal-box.green{background:var(--green);border-color:var(--green);}
  .cal-box.rest{background:var(--gold);border-color:var(--gold);opacity:0.55;}
  .cal-box.muted{background:var(--panel-alt);opacity:0.35;}

  /* celebration overlay */
  #celebrationOverlay{position:fixed;top:18%;left:50%;transform:translateX(-50%) translateY(-10px);
    background:var(--accent);color:#1a0d06;font-family:var(--display);font-weight:800;font-size:14px;
    padding:14px 22px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,0.4);z-index:200;
    opacity:0;pointer-events:none;transition:opacity .25s ease, transform .25s ease;text-align:center;}
  #celebrationOverlay.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* full green fill once ticked */
  .drill.ticked{background:rgba(127,216,88,0.14);border-radius:8px;margin:0 -8px 0 -8px;padding-left:8px;
    padding-right:8px;}
  tr.ticked td{background:rgba(127,216,88,0.14);}

  .tab{font-family:var(--mono);font-weight:700;font-size:13px;padding:9px 14px;border-radius:7px;
    background:var(--panel);border:1px solid var(--border);color:var(--text-dim);cursor:pointer;
    letter-spacing:0.03em;transition:all .12s ease;}
  .tab:hover{border-color:#4a5058;color:var(--text);}
  .tab.active{background:var(--accent);border-color:var(--accent);color:#1a0d06;}
  .tab.deload.active{background:var(--gold);border-color:var(--gold);}

  /* coach note */
  .coachnote{background:var(--panel);border:1px solid var(--border);border-left:4px solid var(--accent);
    border-radius:var(--radius);padding:16px 18px;margin:16px 0 26px;font-size:14.5px;line-height:1.6;}
  .coachnote .tag{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:0.1em;
    font-size:11.5px;color:var(--accent);margin-bottom:6px;display:block;}
  .coachnote-card{border-left:4px solid var(--accent);margin-bottom:22px;}
  .coachnote-card .card-body{white-space:pre-line;font-size:14px;line-height:1.6;}

  /* day structure */
  .day-header{font-family:var(--display);font-weight:800;font-size:12px;text-transform:uppercase;
    letter-spacing:0.14em;color:var(--text-dim);margin:26px 0 10px;padding-bottom:7px;
    border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;}
  .day-header:first-of-type{margin-top:4px;}
  .day-header .day-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex-shrink:0;}
  .rest-day{background:var(--panel);border:1px dashed var(--border);border-radius:var(--radius);
    padding:16px;margin-bottom:8px;color:var(--text-dim);font-size:13px;text-align:center;
    font-style:italic;}
  .readonly-banner{background:var(--panel-alt);border:1px solid var(--border);border-radius:8px;
    padding:10px 14px;margin:14px 0 4px;font-size:12.5px;color:var(--text-dim);text-align:center;}

  /* login gate */
  #loginScreen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;
    justify-content:center;padding:20px;z-index:100;}
  .login-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    padding:28px 26px;max-width:340px;width:100%;}
  .login-card .wordmark{font-size:26px;margin-bottom:2px;}
  .login-card .subtitle{margin-bottom:20px;}
  .login-card input{width:100%;background:var(--panel-alt);border:1px solid var(--border);
    border-radius:7px;color:var(--text);padding:10px 12px;font-size:14px;margin-bottom:10px;
    font-family:inherit;box-sizing:border-box;}
  .login-card button{width:100%;background:var(--accent);color:#1a0d06;border:none;border-radius:7px;
    padding:11px;font-weight:800;font-size:13px;cursor:pointer;font-family:var(--display);
    letter-spacing:0.03em;text-transform:uppercase;margin-top:4px;}
  .login-error{color:#FF8A6B;font-size:12.5px;margin-top:10px;min-height:16px;}
  .demo-banner{background:#1E2A24;border:1px solid #2E4A3B;border-radius:8px;padding:10px 14px;
    margin:16px 0 4px;font-size:12.5px;color:#8FD9AE;text-align:center;}
  .logout-link{font-family:var(--mono);font-size:11px;color:var(--text-dim);cursor:pointer;
    text-decoration:underline;margin-top:4px;display:inline-block;}

  /* section card */
  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    margin-bottom:14px;overflow:hidden;transition:border-color .15s ease;}
  .card.session-done{border-color:var(--green);}
  .session-check{width:18px;height:18px;accent-color:var(--green);flex-shrink:0;cursor:pointer;margin:0;}
  .card-head{display:flex;align-items:center;gap:12px;padding:15px 16px;cursor:pointer;
    user-select:none;}
  .card-head:hover{background:var(--panel-alt);}
  .code-tag{font-family:var(--mono);font-weight:700;font-size:11.5px;padding:4px 8px;border-radius:5px;
    background:var(--accent-dim);color:#FFB199;letter-spacing:0.03em;white-space:nowrap;}
  .card-title{font-family:var(--display);font-weight:800;font-size:17px;text-transform:uppercase;
    letter-spacing:0.02em;flex:1;}
  .card-time{font-family:var(--mono);font-size:12.5px;color:var(--text-dim);white-space:nowrap;}
  .chevron{font-size:12px;color:var(--text-dim);transition:transform .15s ease;}
  .card.open .chevron{transform:rotate(90deg);}
  .card-body{display:none;padding:2px 16px 18px;border-top:1px solid var(--border);}
  .card.open .card-body{display:block;}
  .progress-pill{font-family:var(--mono);font-size:11px;color:var(--text-dim);}
  .progress-pill.done{color:var(--green);}

  /* drill */
  .drill{padding:14px 0;border-bottom:1px solid var(--border);}
  .drill:last-child{border-bottom:none;}
  .drill-row{display:flex;align-items:flex-start;gap:10px;}
  .drill input[type=checkbox]{margin-top:3px;width:17px;height:17px;accent-color:var(--green);flex-shrink:0;cursor:pointer;}
  .drill-name{font-weight:700;font-size:14.5px;}
  .drill-time{font-family:var(--mono);font-size:11.5px;color:var(--text-dim);margin-left:8px;}
  .drill-desc{font-size:13.5px;color:var(--text-dim);margin-top:5px;line-height:1.55;}
  .drill-actions{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .vid-btn{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;
    color:var(--blue);text-decoration:none;border:1px solid #2C4A57;background:#182428;
    padding:6px 10px;border-radius:6px;}
  .vid-btn:hover{background:#1c2e34;}
  .vid-btn{cursor:pointer;font-family:inherit;}
  .vid-embed{display:none;}
  .vid-embed.open{display:block;margin-top:10px;position:relative;width:100%;max-width:420px;
    aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:#000;border:1px solid var(--border);}
  .vid-embed.open iframe{width:100%;height:100%;border:0;display:block;}
  .vid-fallback{font-size:11.5px;color:var(--text-dim);margin-top:6px;}
  .vid-fallback a{color:var(--blue);}

  /* set tables (fingerboard / conditioning) */
  .set-table{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px;}
  .set-table th{text-align:left;font-family:var(--display);font-weight:700;font-size:10.5px;
    text-transform:uppercase;letter-spacing:0.06em;color:var(--text-dim);padding:6px 8px;
    border-bottom:1px solid var(--border);}
  .set-table td{padding:7px 8px;border-bottom:1px solid #26292E;}
  .set-table tr.rest td{color:var(--text-dim);font-style:italic;font-size:12px;padding:4px 8px;}
  .set-table input[type=text]{width:64px;background:var(--panel-alt);border:1px solid var(--border);
    border-radius:5px;color:var(--text);padding:5px 6px;font-size:12.5px;font-family:var(--mono);}
  .set-table input[type=checkbox]{accent-color:var(--green);width:16px;height:16px;cursor:pointer;}

  /* projecting */
  .goal-ladder{list-style:none;margin:10px 0;padding:0;counter-reset:goal;}
  .goal-ladder li{counter-increment:goal;padding:8px 0 8px 30px;position:relative;font-size:13.5px;
    border-bottom:1px solid #26292E;}
  .goal-ladder li:last-child{border-bottom:none;}
  .goal-ladder li::before{content:counter(goal);position:absolute;left:0;top:7px;width:20px;height:20px;
    border-radius:50%;background:var(--panel-alt);border:1px solid var(--border);font-family:var(--mono);
    font-size:11px;display:flex;align-items:center;justify-content:center;color:var(--text-dim);}
  .journal{margin-top:14px;background:var(--panel-alt);border:1px solid var(--border);border-radius:8px;
    padding:14px;}
  .journal label{display:block;font-family:var(--display);font-weight:700;font-size:11px;
    text-transform:uppercase;letter-spacing:0.05em;color:var(--accent);margin:10px 0 4px;}
  .journal label:first-child{margin-top:0;}
  .journal textarea{width:100%;background:var(--panel);border:1px solid var(--border);border-radius:6px;
    color:var(--text);padding:8px 10px;font-size:13px;font-family:inherit;resize:vertical;min-height:40px;}
  .journal-save{margin-top:10px;background:var(--accent);color:#1a0d06;border:none;border-radius:6px;
    padding:8px 14px;font-weight:700;font-size:12.5px;cursor:pointer;font-family:var(--display);
    letter-spacing:0.03em;text-transform:uppercase;}
  .journal-status{font-size:11.5px;color:var(--green);margin-left:10px;opacity:0;transition:opacity .2s;}
  .form-link{font-size:12.5px;color:var(--blue);}

  .deload-msg{background:var(--panel);border:1px solid var(--gold);border-radius:var(--radius);
    padding:20px;text-align:center;margin-top:10px;}
  .deload-msg .big{font-family:var(--display);font-weight:800;font-size:20px;text-transform:uppercase;
    color:var(--gold);letter-spacing:0.03em;margin-bottom:6px;}
  .deload-msg p{color:var(--text-dim);font-size:13.5px;line-height:1.6;max-width:480px;margin:0 auto;}

  .note-box{background:#241C15;border:1px solid #4A3620;border-radius:8px;padding:10px 12px;
    font-size:12.5px;color:#D9B98A;margin:14px 0 4px;line-height:1.5;}

  footer{max-width:920px;margin:30px auto 0;padding:0 18px;color:var(--text-dim);font-size:11.5px;
    text-align:center;}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-card">
    <div class="wordmark">CATALYST<span>.</span></div>
    <div class="subtitle">Training Companion</div>
    <form id="loginForm">
      <input type="email" id="loginEmail" placeholder="Email" autocomplete="username" required>
      <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password" required>
      <button type="submit">Log in</button>
    </form>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<header style="display:none;">
  <div class="headbar">
    <div>
      <div class="wordmark">CATALYST<span>.</span></div>
      <div class="subtitle">Training Companion</div>
    </div>
    <div class="meta">
      <div>Student: <b>Vincent Husset</b></div>
      <div>Coach: <b>Dave Aubrey</b></div>
      <div>Cycle start: <b>20 Aug 2026</b></div>
      <div class="logout-link" id="logoutBtn">Log out</div>
    </div>
  </div>
</header>

<div class="wrap" style="display:none;">
  <div id="demoBanner"></div>
  <div class="view-tabs" id="viewTabs"></div>
  <div id="overviewContent" style="display:none;"></div>
  <div id="sessionArea">
    <div class="tabs" id="tabs"></div>
    <div id="content"></div>
  </div>
</div>
<div id="celebrationOverlay"></div>

<footer>Built from your Catalyst reference glossary + Dave's 5-week plan. Progress and notes are saved automatically.</footer>

<script>
/* ---------- VIDEO LINKS ---------- */
const VID = {
  A1: "https://youtu.be/VkWt3qsmXJ4",
  A2: "https://youtu.be/QT1CJtIk-Ls",
  A3: "https://youtu.be/1sPH9_NiW8k",
  B8: "https://youtu.be/fv71ejrYBXE",
  B9: "https://youtu.be/cqIu1P85CH8",
  C:  "https://youtu.be/GKN9_e4XEaM",
  E1: "https://youtu.be/mAUg6h-lNDA",
  E2: "https://youtu.be/0uAJpsjiJPA",
  ROBOT_RULES: "https://www.youtube.com/watch?v=qisig3VzIcY",
  J16: "https://youtu.be/Oy_gXJH0VHA",
  J17: "https://youtu.be/FqHsgLd5ikc",
  J18: "https://youtu.be/rN0-jZLynro",
  J12: "https://youtu.be/4MQylF5S3lA",
  FB_GUIDE: "https://youtu.be/o-h5aRi9Ie8",
  STRETCH_UPPER: "https://youtu.be/9qcghR2O--g",
  STRETCH_LOWER: "https://youtu.be/phpD_TDx474",
  PROJECT_FORM: "https://docs.google.com/forms/d/e/1FAIpQLSc-xpqfzNlGXbkBHf-PIf9PX84VZ8Isuqi-4vk3TZLu5yp-dg/viewform?usp=header"
};

/* ---------- COACH NOTES PER WEEK ---------- */
const COACH_NOTES = {
  1: `I have given you a straightforward strength based plan. There is lots of scope to work on technique and mindset, etc, but we can address those in future plans.
Your first session is projecting — choose limit boulders, ones you would normally be wary of trying, and set appropriate goals for each session. The second session is on-the-wall strength training: a bit of overhang fitness, then some boulder-specific strength work.
Conditioning is as hard as you make it — sink deep into the positions and still finish all reps, resting as little as possible while still able to complete the set.
Take some time before your first fingerboard session to calibrate the weight you need to add or remove to hit the right RPE. Follow the warm-up video carefully — Dave has done this warm-up every session for 5 years and swears by it.
Try Hard, Have Fun and Fall Off More!`,
  2: `Same structure as Week 1 — keep applying it. Projecting session first, on-the-wall strength second. You should have your fingerboard RPE calibrated by now, so use that same added weight/assistance unless it needs adjusting.
Keep pushing the conditioning as hard as you can while still finishing every rep with good form.`,
  3: `Same structure again. This is where consistency starts to matter more than intensity — keep the sessions, keep the notes on your projecting attempts, and keep an eye on how your fingerboard RPE is trending week to week.`,
  4: `Please get in touch with enquiries@catalystclimbing.com to arrange your next training cycle!`,
  5: `Deload week — no on-the-wall, conditioning or fingerboard work. Just three stretching sessions to help you recover before your next cycle.`
};

/* ---------- SHARED SESSION TEMPLATES (Weeks 1-4 identical) ---------- */
function onWallSession1(){
  return {
    title: "On The Wall — Session 1 (Projecting)",
    code: "C",
    time: "~120 min",
    drills: [
      {code:"A1", name:"Dynamic Stretching Warm Up", time:"10 min", vid:VID.A1,
        desc:"Work up through every joint from toes to head — 5 slow circles/clenches, then 5 fast ones, at each joint."},
      {code:"A2", name:"Cardio Warm Up", time:"10 min", vid:VID.A2,
        desc:"Raise your temperature with floor-based movement (Lizard / Frog / Bird / Chimpanzee) or any cardio you enjoy."},
      {code:"A3", name:"Easy Climbing Warm Up", time:"10 min", vid:VID.A3,
        desc:"Progress up through the grades on easy climbs to get warm before the session's main work."},
      {code:"B8", name:"One Touch Only", time:"20 min", vid:VID.B8,
        desc:"Get fully warmed up by progressing through the grades while focusing intently on precision of hand/foot placement. Move slowly and with control — once a hand/foot is placed, it doesn't move again."},
      {code:"C", name:"Projecting — Hard Project Time!", time:"70 min", vid:VID.C, special:"projecting",
        desc:"Walk the gym and pick 1–2 boulders that genuinely psych you — check the setting schedule so they'll be up for ~3 weeks. The goal is NOT to send yet."}
    ]
  };
}
function onWallSessionClass(){
  return {
    title: "On The Wall — Session 2 (Class)",
    code: "",
    time: "Coached class",
    drills: []
  };
}
function onWallSession3(){
  return {
    title: "On The Wall — Session 3 (Strength)",
    code: "E",
    time: "~120 min",
    drills: [
      {code:"A1", name:"Dynamic Stretching Warm Up", time:"10 min", vid:VID.A1,
        desc:"Same warm-up routine as Session 1 — toes to head, slow then fast."},
      {code:"A2", name:"Cardio Warm Up", time:"10 min", vid:VID.A2,
        desc:"Raise your temperature with floor-based animal movements or any cardio you enjoy."},
      {code:"A3", name:"Easy Climbing Warm Up", time:"10 min", vid:VID.A3,
        desc:"Progress up through the grades on easy climbs."},
      {code:"B9", name:"No Hesitation", time:"30 min", vid:VID.B9,
        desc:"Practice commitment and moving with conviction. Failing this drill is not falling off — it's hesitating. If you feel unsure, go for it anyway; you'll learn you can do more than you thought."},

async function countTrue(keys){
  let n = 0;
  for(const k of keys){ if(await getVal(k, false)) n++; }
  return n;
}
async function anyTrue(keys){
  for(const k of keys){ if(await getVal(k, false)) return true; }
  return false;
}
async function computeCycleCounts(){
  const wall = await countTrue(CYCLE_SESSION_KEYS.wall);
  const fingerboard = await countTrue(CYCLE_SESSION_KEYS.fingerboard);
  const conditioning = await countTrue(CYCLE_SESSION_KEYS.conditioning);
  let weeksActive = 0;
  for(const wk of ['w1','w2','w3','w4','w5']){
    if(await anyTrue(WEEK_SESSION_KEYS[wk])) weeksActive++;
  }
  return { wall, fingerboard, conditioning, weeksActive,
           maxWall:12, maxFingerboard:8, maxConditioning:4, maxWeeks:5 };
}
async function computeAllTime(cycleCounts){
  return {
    wall: (await getArchivedTotal('wall')) + cycleCounts.wall,
    fingerboard: (await getArchivedTotal('fingerboard')) + cycleCounts.fingerboard,
    conditioning: (await getArchivedTotal('conditioning')) + cycleCounts.conditioning,
    weeksActive: (await getArchivedTotal('weeksActive')) + cycleCounts.weeksActive
  };
}
async function computeCalendarGrid(){
  const grid = [];
  for(let w=1; w<=5; w++){
    const wk = `w${w}`;
    if(w === 5){
      grid.push(DAY_PLAN.map(d => ({state: d.rest ? 'rest' : 'muted'})));
      continue;
    }
    const row = [];
    for(const d of DAY_PLAN){
      if(d.rest){ row.push({state:'rest'}); continue; }
      let any = false;
      for(const suffix of d.cardKeys){
        if(await getVal(`done:${wk}:${suffix}:session`, false)){ any = true; break; }
      }
      row.push({state: any ? 'green' : 'blank'});
    }
    grid.push(row);
  }
  return grid;
}
function findDayForCardKey(cardKey){
  // cardKey like "w1:onwall1" -> find which DAY_PLAN entry contains that suffix
  const [wk, suffix] = cardKey.split(':');
  if(!wk || !suffix) return null;
  const entry = DAY_PLAN.find(d => d.cardKeys.includes(suffix));
  return entry ? {weekKey: wk, entry} : null;
}
async function isDayFullyDone(weekKey, entry){
  if(!entry.cardKeys.length) return false;
  for(const suffix of entry.cardKeys){
    if(!(await getVal(`done:${weekKey}:${suffix}:session`, false))) return false;
  }
  return true;
}

/* ---------- STORAGE HELPERS ---------- */
const STORAGE_PREFIX = 'catalyst_companion:';
// Every plan cycle gets its own permanent namespace, so uploading next
// month's plan can never overwrite or collide with this month's history.
window.CYCLE_ID = 'cycle-2026-08';
let storageBackend = 'memory'; // 'memory' until login resolves which mode applies
const memoryStore = {};

function cycleKey(key){ return `${window.CYCLE_ID}:${key}`; }

async function getVal(key, fallback){
  const fullKey = cycleKey(key);
  if(storageBackend === 'memory'){
    return Object.prototype.hasOwnProperty.call(memoryStore, fullKey) ? memoryStore[fullKey] : fallback;
  }
  try{
    const v = localStorage.getItem(STORAGE_PREFIX + fullKey);
    return v === null ? fallback : JSON.parse(v);
  }catch(e){ return fallback; }
}
async function setVal(key, val){
  const fullKey = cycleKey(key);
  if(storageBackend === 'memory'){
    memoryStore[fullKey] = val;
    return;
  }
  try{ localStorage.setItem(STORAGE_PREFIX + fullKey, JSON.stringify(val)); }
  catch(e){ console.error("storage set failed", e); }
}
// Permanent, cycle-independent totals from cycles that have already ended.
// Starts at 0 — will be incremented by hand each time a new monthly plan
// replaces this one, so All-Time keeps growing across every past cycle.
async function getArchivedTotal(category){
  return await getValRaw(`archived:${category}`, 0);
}
async function getValRaw(rawKey, fallback){
  if(storageBackend === 'memory'){
    return Object.prototype.hasOwnProperty.call(memoryStore, rawKey) ? memoryStore[rawKey] : fallback;
  }
  try{
    const v = localStorage.getItem(STORAGE_PREFIX + rawKey);
    return v === null ? fallback : JSON.parse(v);
  }catch(e){ return fallback; }
}

function ringSVG(value, max, colorVar){
  const pct = max > 0 ? Math.min(1, value/max) : 0;
  const r = 42, c = 2*Math.PI*r, offset = c*(1-pct);
  return `
  <svg viewBox="0 0 100 100" class="ring-svg">
    <circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--panel-alt)" stroke-width="10"/>
    <circle cx="50" cy="50" r="${r}" fill="none" stroke="${colorVar}" stroke-width="10"
      stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${offset}"
      transform="rotate(-90 50 50)"/>
  </svg>`;
}
function ringCard(value, max, colorVar, label){
  return `
  <div class="ring-card">
    <div class="ring-wrap">
      ${ringSVG(value, max, colorVar)}
      <div class="ring-value">${value}/${max}</div>
    </div>
    <div class="ring-label">${label}</div>
  </div>`;
}

  return {embed: `https://www.youtube.com/embed/${id}`, watch: `https://www.youtube.com/watch?v=${id}`};

        <input type="checkbox" data-key="done:${ckKey}">
        <div style="flex:1;display:flex;justify-content:space-between;">
          <span class="drill-name" style="font-size:13.5px;">${st.name}</span>
          <span class="drill-time">${st.time}</span>
        </div>
      </div>
    </div>`;
  }).join('');
  const body = `
    <div class="drill-actions" style="margin-bottom:4px;">
      ${vidButton(vid, '▶ Watch stretch demo')}
    </div>
    ${rows}`;
  return cardShell(`${weekKey}:${key}`, s.title, "", s.time, body);
}

function renderContent(){
  const wk = WEEKS[currentWeek];
  const weekKey = `w${currentWeek}`;

  if(wk.deload){
    contentEl.innerHTML = `
      ${wk.coachNote ? coachNoteCardHTML(weekKey, currentWeek, wk.coachNote) : ''}
      <div class="deload-msg">
        <div class="big">Deload Week</div>
        <p>No on-the-wall, conditioning or fingerboard work this week. Just three stretching sessions to recover — then get in touch with Dave (enquiries@catalystclimbing.com) to arrange your next cycle.</p>
      </div>
      <div style="margin-top:14px;">
        ${stretchCardHTML(weekKey, 'stretch1', stretchSession(1), VID.STRETCH_UPPER)}
        ${stretchCardHTML(weekKey, 'stretch2', stretchSession(2), VID.STRETCH_LOWER)}
        ${stretchCardHTML(weekKey, 'stretch3', stretchSession(3), VID.STRETCH_LOWER)}

    attachHandlers();

  let html = '';

  }

  html += dayHeader('Monday');
  html += onWallCardHTML(`${weekKey}:onwall1`, wk.onWall1);
  html += stretchCardHTML(weekKey, 'stretch1', wk.stretch1, VID.STRETCH_UPPER);

  html += dayHeader('Tuesday');
  html += fingerboardCardHTML(weekKey, 'fbmax', wk.fbMax);

  html += dayHeader('Wednesday');
  html += onWallCardHTML(`${weekKey}:onwallclass`, wk.onWallClass);

  html += restDayHTML('Thursday');

  html += dayHeader('Friday');
  html += fingerboardCardHTML(weekKey, 'fbrep', wk.fbRep);

  html += dayHeader('Saturday / Sunday');
  html += onWallCardHTML(`${weekKey}:onwall3`, wk.onWall3);
  html += stretchCardHTML(weekKey, 'stretch2', wk.stretch2, VID.STRETCH_LOWER);

  html += dayHeader('Saturday / Sunday');
  html += conditioningCardHTML(weekKey, wk.conditioning);

  contentEl.innerHTML = html;
  attachHandlers();
  hydrateState();
}

/* ---------- INTERACTIVITY ---------- */
function attachHandlers(){
  document.querySelectorAll('.card-head').forEach(h=>{
    h.onclick = ()=>{
      const card = h.parentElement;
      const key = card.dataset.card;
      if(openCards.has(key)){ openCards.delete(key); card.classList.remove('open'); }
      else{ openCards.add(key); card.classList.add('open'); }
    };
  });

  document.querySelectorAll('.vid-btn[data-embed]').forEach(btn=>{
    btn.onclick = ()=>{
      const target = document.getElementById(btn.dataset.target);
      const wasOpen = target.classList.contains('open');

      // close every other open video first (accordion behaviour)
      document.querySelectorAll('.vid-btn[data-embed]').forEach(otherBtn=>{
        if(otherBtn === btn) return;
        const otherTarget = document.getElementById(otherBtn.dataset.target);
        if(otherTarget && otherTarget.classList.contains('open')){
          otherTarget.classList.remove('open');
          otherTarget.innerHTML = '';
          const otherFallback = otherTarget.nextElementSibling && otherTarget.nextElementSibling.classList.contains('vid-fallback')
            ? otherTarget.nextElementSibling : null;
          if(otherFallback) otherFallback.remove();
          otherBtn.textContent = otherBtn.dataset.label;
        }
      });

      const existingFallback = target.nextElementSibling && target.nextElementSibling.classList.contains('vid-fallback')
        ? target.nextElementSibling : null;
      if(wasOpen){
        target.classList.remove('open');
        target.innerHTML = '';
        if(existingFallback) existingFallback.remove();
        btn.textContent = btn.dataset.label;
      } else {
        target.classList.add('open');
        target.innerHTML = `<iframe src="${btn.dataset.embed}?autoplay=1&playsinline=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
        btn.textContent = btn.dataset.label.replace('▶', '▼').replace(/Watch/i, 'Hide');
        const fallback = document.createElement('div');
        fallback.className = 'vid-fallback';
        fallback.innerHTML = `Video blocked here? <a href="${btn.dataset.watch}" target="_blank" rel="noopener">Open on YouTube instead ↗</a>`;
        target.after(fallback);
      }
    };
  });

  document.querySelectorAll('input[type=checkbox][data-key]').forEach(cb=>{
    cb.onchange = ()=>{
      setVal(cb.dataset.key, cb.checked);
      const drillRow = cb.closest('.drill');
      if(drillRow) drillRow.classList.toggle('ticked', cb.checked);
      const trRow = cb.closest('tr');
      if(trRow) trRow.classList.toggle('ticked', cb.checked);
    };
  });

  document.querySelectorAll('.session-check').forEach(cb=>{
    cb.addEventListener('click', e => e.stopPropagation());
    cb.addEventListener('change', async () => {
      const card = cb.closest('.card');
      if(card) card.classList.toggle('session-done', cb.checked);
      if(cb.checked && card){
        const dayInfo = findDayForCardKey(card.dataset.card);
        if(dayInfo && await isDayFullyDone(dayInfo.weekKey, dayInfo.entry)){
          showCelebration();
        }
      }
    });
  });

  document.querySelectorAll('input[data-weight]').forEach(inp=>{
    inp.onblur = ()=> setVal(`fbweight:${inp.dataset.weight}`, inp.value);
  });
  document.querySelectorAll('input[data-rpe]').forEach(inp=>{
    inp.onblur = ()=> setVal(`condrpe:${inp.dataset.rpe}`, inp.value);
  });

  document.querySelectorAll('textarea[data-note]').forEach(ta=>{
    ta.onblur = ()=> setVal(`note:${ta.dataset.note}`, ta.value);
  });

  document.querySelectorAll('button[data-save]').forEach(btn=>{
    btn.onclick = async ()=>{
      const sk = btn.dataset.save;
      const status = document.querySelector(`[data-status="${sk}"]`);
      status.style.opacity = 1;
      setTimeout(()=>{ status.style.opacity = 0; }, 1800);
    };
  });
}

async function hydrateState(){
  const checks = document.querySelectorAll('input[type=checkbox][data-key]');
  for(const cb of checks){
    const v = await getVal(cb.dataset.key, false);
    cb.checked = !!v;
    const drillRow = cb.closest('.drill');
    if(drillRow) drillRow.classList.toggle('ticked', cb.checked);
    const trRow = cb.closest('tr');
    if(trRow) trRow.classList.toggle('ticked', cb.checked);
  }
  const weights = document.querySelectorAll('input[data-weight]');
  for(const inp of weights){
    const v = await getVal(`fbweight:${inp.dataset.weight}`, '');
    inp.value = v || '';
  }
  const rpes = document.querySelectorAll('input[data-rpe]');
  for(const inp of rpes){
    const v = await getVal(`condrpe:${inp.dataset.rpe}`, '');
    inp.value = v || '';
  }
  const notes = document.querySelectorAll('textarea[data-note]');
  for(const ta of notes){
    const v = await getVal(`note:${ta.dataset.note}`, '');
    ta.value = v || '';
  }

  document.querySelectorAll('.session-check').forEach(cb=>{
    const card = cb.closest('.card');
    if(card) card.classList.toggle('session-done', cb.checked);
  });
}

window.startApp = function(mode){
  storageBackend = mode === 'real' ? 'local' : 'memory';
  if(mode === 'demo'){
    const demoBanner = document.getElementById('demoBanner');
    if(demoBanner){
      demoBanner.innerHTML = `<div class="demo-banner">🧪 Demo mode — click around freely, nothing here is saved.</div>`;
    }
  }
  renderViewTabs();
  renderTabs();
  renderContent();
};

<script type="module">
  const loginScreen = document.getElementById('loginScreen');
  const headerEl = document.querySelector('header');
  const appWrap = document.querySelector('.wrap');
  const loginError = document.getElementById('loginError');

  function showLogin(msg){
    loginScreen.style.display = 'flex';
    headerEl.style.display = 'none';
    appWrap.style.display = 'none';
    loginError.textContent = msg || '';
  }
  function showApp(){
    loginScreen.style.display = 'none';
    headerEl.style.display = '';
    appWrap.style.display = '';
  }

  try {
    const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js");
    const { getFirestore, doc, getDoc, setDoc } = await import("https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js");
    const { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } =
      await import("https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js");

    const firebaseConfig = {
      apiKey: "AIzaSyCqRlaNZhPMhQoQHxoO2b6wAa-DYuOcGvQ",
      authDomain: "catalysttraining.firebaseapp.com",
      projectId: "catalysttraining",
      storageBucket: "catalysttraining.firebasestorage.app",
      messagingSenderId: "1036567541586",
      appId: "1:1036567541586:web:7f4d3ab61f0b27216d6c8b"
    };
    const MY_UID = "G3SenM8rFvTA7Fh32zszFw9bIOY2";
    const PREFIX = 'catalyst_companion:';

    const fbApp = initializeApp(firebaseConfig);
    const db = getFirestore(fbApp);
    const auth = getAuth(fbApp);
    const progressDocRef = doc(db, "companion", "vincent");

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      loginError.textContent = '';
      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (err) {
        loginError.textContent = 'Login failed — check your email and password.';
      }
    });

    document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        showLogin();
        return;
      }
      showApp();
      const isReal = user.uid === MY_UID;

      if (isReal) {
        // Pull whatever's saved in the cloud into local storage first
        try {
          const snap = await getDoc(progressDocRef);
          if (snap.exists()) {
            const remote = snap.data() || {};
            Object.keys(remote).forEach(k => {
              try { localStorage.setItem(PREFIX + k, JSON.stringify(remote[k])); } catch (e) {}
            });
          }
        } catch (e) {
          console.warn('Cloud load failed, starting from local cache.', e);
        }

        window.startApp('real');

        // Upgrade setVal so every future save also pushes to the cloud
        const originalSetVal = window.setVal;
        window.setVal = async function (key, val) {
          await originalSetVal(key, val);
          try {
            const fullKey = `${window.CYCLE_ID}:${key}`;
            await setDoc(progressDocRef, { [fullKey]: val }, { merge: true });
          } catch (e) {
            console.warn('Cloud sync write failed, saved locally only.', e);
          }
        };
        console.log('Logged in as Vincent — cloud sync active.');
      } else {
        // Any other account: fully interactive demo, nothing persists anywhere
        window.startApp('demo');
        console.log('Logged in as demo — nothing will be saved.');
      }
    });
  } catch (e) {
    console.error('Firebase failed to load — login unavailable.', e);
    loginError.textContent = 'Connection error — please check your internet and reload.';
  }
</script>
