<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catalyst Training Companion — Vincent Husset</title>
<style>
  :root{
    --bg: #14161A;
    --panel: #1D2025;
    --panel-alt: #262A30;
    --border: #33383F;
    --text: #ECE8DE;
    --text-dim: #9A9FA6;
    --accent: #FF5A2E;
    --accent-dim: #7A2F1B;
    --blue: #49AEDB;
    --green: #7FD858;
    --gold: #C9A94F;
    --radius: 10px;
    --display: 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
    --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;}
  body{padding:0 0 60px 0;}
  .wrap{max-width:920px;margin:0 auto;padding:0 18px;}

  header{border-bottom:1px solid var(--border);background:
    linear-gradient(180deg, #191B1F 0%, #14161A 100%);}
  .headbar{max-width:920px;margin:0 auto;padding:26px 18px 20px;
    display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:14px;}
  .wordmark{font-family:var(--display);font-weight:800;font-size:34px;letter-spacing:0.03em;
    text-transform:uppercase;line-height:0.9;}
  .wordmark span{color:var(--accent);}
  .subtitle{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:0.22em;
    color:var(--text-dim);text-transform:uppercase;margin-top:4px;}
  .meta{text-align:right;font-size:12.5px;color:var(--text-dim);line-height:1.7;}
  .meta b{color:var(--text);font-weight:600;}

  .tabs{display:flex;gap:8px;margin:22px 0 6px;flex-wrap:wrap;}
  .tab{font-family:var(--mono);font-weight:700;font-size:13px;padding:9px 14px;border-radius:7px;
    background:var(--panel);border:1px solid var(--border);color:var(--text-dim);cursor:pointer;
    letter-spacing:0.03em;transition:all .12s ease;}
  .tab:hover{border-color:#4a5058;color:var(--text);}
  .tab.active{background:var(--accent);border-color:var(--accent);color:#1a0d06;}
  .tab.deload.active{background:var(--gold);border-color:var(--gold);}

  .coachnote{background:var(--panel);border:1px solid var(--border);border-left:4px solid var(--accent);
    border-radius:var(--radius);padding:16px 18px;margin:16px 0 26px;font-size:14.5px;line-height:1.6;}
  .coachnote .tag{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:0.1em;
    font-size:11.5px;color:var(--accent);margin-bottom:6px;display:block;}
  .coachnote-card{border-left:4px solid var(--accent);margin-bottom:22px;}
  .coachnote-card .card-body{white-space:pre-line;font-size:14px;line-height:1.6;}

  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    margin-bottom:14px;overflow:hidden;transition:border-color .15s ease;}
  .card.session-done{border-color:var(--green);}
  .session-check{width:18px;height:18px;accent-color:var(--green);flex-shrink:0;cursor:pointer;margin:0;}
  .card-head{display:flex;align-items:center;gap:12px;padding:15px 16px;cursor:pointer;
    user-select:none;}
  .card-head:hover{background:var(--panel-alt);}
  .code-tag{font-family:var(--mono);font-weight:700;font-size:11.5px;padding:4px 8px;border-radius:5px;
    background:var(--accent-dim);color:#FFB199;letter-spacing:0.03em;white-space:nowrap;}
  .card-title{font-family:var(--display);font-weight:800;font-size:17px;text-transform:uppercase;
    letter-spacing:0.02em;flex:1;}
  .card-time{font-family:var(--mono);font-size:12.5px;color:var(--text-dim);white-space:nowrap;}
  .chevron{font-size:12px;color:var(--text-dim);transition:transform .15s ease;}
  .card.open .chevron{transform:rotate(90deg);}
  .card-body{display:none;padding:2px 16px 18px;border-top:1px solid var(--border);}
  .card.open .card-body{display:block;}
  .progress-pill{font-family:var(--mono);font-size:11px;color:var(--text-dim);}
  .progress-pill.done{color:var(--green);}

  .drill{padding:14px 0;border-bottom:1px solid var(--border);}
  .drill:last-child{border-bottom:none;}
  .drill-row{display:flex;align-items:flex-start;gap:10px;}
  .drill input[type=checkbox]{margin-top:3px;width:17px;height:17px;accent-color:var(--green);flex-shrink:0;cursor:pointer;}
  .drill-name{font-weight:700;font-size:14.5px;}
  .drill-time{font-family:var(--mono);font-size:11.5px;color:var(--text-dim);margin-left:8px;}
  .drill-desc{font-size:13.5px;color:var(--text-dim);margin-top:5px;line-height:1.55;}
  .drill-actions{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .vid-btn{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;
    color:var(--blue);text-decoration:none;border:1px solid #2C4A57;background:#182428;
    padding:6px 10px;border-radius:6px;}
  .vid-btn:hover{background:#1c2e34;}
  .vid-btn{cursor:pointer;font-family:inherit;}
  .vid-embed{display:none;}
  .vid-embed.open{display:block;margin-top:10px;position:relative;width:100%;max-width:420px;
    aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:#000;border:1px solid var(--border);}
  .vid-embed.open iframe{width:100%;height:100%;border:0;display:block;}
  .vid-fallback{font-size:11.5px;color:var(--text-dim);margin-top:6px;}
  .vid-fallback a{color:var(--blue);}

  .set-table{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px;}
  .set-table th{text-align:left;font-family:var(--display);font-weight:700;font-size:10.5px;
    text-transform:uppercase;letter-spacing:0.06em;color:var(--text-dim);padding:6px 8px;
    border-bottom:1px solid var(--border);}
  .set-table td{padding:7px 8px;border-bottom:1px solid #26292E;}
  .set-table tr.rest td{color:var(--text-dim);font-style:italic;font-size:12px;padding:4px 8px;}
  .set-table input[type=text]{width:64px;background:var(--panel-alt);border:1px solid var(--border);
    border-radius:5px;color:var(--text);padding:5px 6px;font-size:12.5px;font-family:var(--mono);}
  .set-table input[type=checkbox]{accent-color:var(--green);width:16px;height:16px;cursor:pointer;}

  .goal-ladder{list-style:none;margin:10px 0;padding:0;counter-reset:goal;}
  .goal-ladder li{counter-increment:goal;padding:8px 0 8px 30px;position:relative;font-size:13.5px;
    border-bottom:1px solid #26292E;}
  .goal-ladder li:last-child{border-bottom:none;}
  .goal-ladder li::before{content:counter(goal);position:absolute;left:0;top:7px;width:20px;height:20px;
    border-radius:50%;background:var(--panel-alt);border:1px solid var(--border);font-family:var(--mono);
    font-size:11px;display:flex;align-items:center;justify-content:center;color:var(--text-dim);}
  .journal{margin-top:14px;background:var(--panel-alt);border:1px solid var(--border);border-radius:8px;
    padding:14px;}
  .journal label{display:block;font-family:var(--display);font-weight:700;font-size:11px;
    text-transform:uppercase;letter-spacing:0.05em;color:var(--accent);margin:10px 0 4px;}
  .journal label:first-child{margin-top:0;}
  .journal textarea{width:100%;background:var(--panel);border:1px solid var(--border);border-radius:6px;
    color:var(--text);padding:8px 10px;font-size:13px;font-family:inherit;resize:vertical;min-height:40px;}
  .journal-save{margin-top:10px;background:var(--accent);color:#1a0d06;border:none;border-radius:6px;
    padding:8px 14px;font-weight:700;font-size:12.5px;cursor:pointer;font-family:var(--display);
    letter-spacing:0.03em;text-transform:uppercase;}
  .journal-status{font-size:11.5px;color:var(--green);margin-left:10px;opacity:0;transition:opacity .2s;}
  .form-link{font-size:12.5px;color:var(--blue);}

  .deload-msg{background:var(--panel);border:1px solid var(--gold);border-radius:var(--radius);
    padding:20px;text-align:center;margin-top:10px;}
  .deload-msg .big{font-family:var(--display);font-weight:800;font-size:20px;text-transform:uppercase;
    color:var(--gold);letter-spacing:0.03em;margin-bottom:6px;}
  .deload-msg p{color:var(--text-dim);font-size:13.5px;line-height:1.6;max-width:480px;margin:0 auto;}

  .note-box{background:#241C15;border:1px solid #4A3620;border-radius:8px;padding:10px 12px;
    font-size:12.5px;color:#D9B98A;margin:14px 0 4px;line-height:1.5;}

  footer{max-width:920px;margin:30px auto 0;padding:0 18px;color:var(--text-dim);font-size:11.5px;
    text-align:center;}
</style>
</head>
<body>

    <div>
